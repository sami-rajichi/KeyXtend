[workspace]
# New crates are listed here by name when created (see kx-new-module).
members = ["apps/keyxtend", "apps/keyxtend-worker", "crates/kx-crypto", "crates/kx-ipc", "crates/kx-kernel", "crates/kx-mod-clipboard", "crates/kx-mod-keyboard", "crates/kx-mod-layouts", "crates/kx-mod-mouse", "crates/kx-mod-power", "crates/kx-mod-predict", "crates/kx-mod-scroll", "crates/kx-module-api", "crates/kx-platform", "crates/kx-platform-fake", "crates/kx-platform-windows", "crates/kx-settings", "crates/kx-test-support", "crates/kx-theme", "crates/kx-ui", "tools/kx-gates", "tools/kx-target-window", "tools/kx-test-icons", "xtask"]
# The spike has its own workspace; excluding it keeps Cargo from taking this file as the root of a spike crate.
exclude = ["spike"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
publish = false
repository = "https://github.com/sami-rajichi/KeyXtend"

[workspace.lints.rust]
# Deny, not forbid, so kx-platform-* and the test tools can allow it; other crate roots forbid it (tidy F2).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
thiserror = "2.0.21"
# The media worker's PNG decoder (ADR-0034 decision 5); tidy bans it from the uiAccess app.
png = "0.18.1"
toml = "1.1.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
windows = "0.62.2"
# windows-rs's `implement` macro writes `windows_core` paths, so the crate that uses it names it too; same release.
windows-core = "0.62.2"
embed-manifest = "1.5.1"
fluent-bundle = "0.16.0"
fluent-langneg = "0.13.1"
unic-langid = "0.9.6"
# Sealed files (ADR-0010): RustCrypto's AEAD, OS randomness and wiping secrets from memory.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
zeroize = "1.9.1"
# Qt through cxx-qt, pinned: every upgrade is reviewed (ADR-0013).
cxx = "1.0.202"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = "=0.10.0"

[workspace.metadata.tidy]
# A source file over this many lines fails tidy.
max_file_lines = 400
# A source file over this many lines warns.
warn_file_lines = 300
# File extensions the size rule scans.
extensions = ["rs", "qml"]
# Directories tidy scans for source files.
scan_dirs = ["apps", "crates", "tools", "xtask"]
# Directories tidy never scans.
skip_dirs = ["target"]
# Packages whose manifest is under this folder are apps, not modules.
app_dir = "apps"
# Packages whose manifest is under this folder are test tools, which never ship.
tool_dir = "tools"
# The build tool, which never ships; like the test tools, it may depend on a module (kx-mod-predict's pack writer).
build_tool = "xtask"
# Crate-name prefix for feature modules.
module_prefix = "kx-mod-"
# Crate-name prefix for platform adapters.
platform_prefix = "kx-platform-"
# The only workspace crates a module may depend on.
module_allowed = ["kx-module-api"]
# The uiAccess app that the network and media bans protect.
app = "keyxtend"
# Network crates banned from the app (ARCHITECTURE.md invariant 4).
banned_network = ["reqwest", "hyper", "ureq", "rustls", "native-tls"]
# Media-decoding crates banned from the app (ARCHITECTURE.md invariant 5); the media worker alone decodes PNG (ADR-0034).
banned_media = ["image", "symphonia", "hound", "lopdf", "ffmpeg-next", "gstreamer", "png", "fdeflate"]
# Crate features no package may turn on (tidy D6): toml's `unbounded` lifts the nesting limit that keeps a settings file from overflowing the stack.
banned_features = { toml = ["unbounded"] }
# Crate features only builds, tests and tools may turn on (tidy D7): kx-theme's `files` reads the assets folder and parses
# WAV files, which the uiAccess app never does (ADR-0004).
build_only_features = { kx-mod-predict = ["build"], kx-theme = ["files"] }
# Attribute every non-platform crate root must carry.
unsafe_attr = "#![forbid(unsafe_code)]"
# Attribute a test tool's or the bridge crate's roots may carry instead, so a scoped allow can hold the unsafe code.
deny_attr = "#![deny(unsafe_code)]"
# Target kinds counted as a crate root for the unsafe-attribute rule.
root_kinds = ["lib", "bin", "proc-macro"]
# Crates only tests and tools may depend on (tidy D5); they must forbid unsafe code even with the platform prefix (tidy F2).
test_only = ["kx-test-support", "kx-platform-fake"]
# The one crate beside the platform adapters that holds unsafe code: the cxx-qt bridges (ADR-0013, tidy F3).
bridge_crate = "kx-ui"
# The folder, inside that crate, that alone may hold unsafe code and its allow.
bridge_dir = "src/bridges"
# The comment that must stand above each unsafe use in that folder.
safety_tag = "// SAFETY:"
# Folders whose packages' product code starts no process itself (tidy F4): a worker starts through the platform's
# spawner, which lowers its rights and lets it inherit only its pipes.
spawn_dirs = ["apps", "crates"]
# File extensions F4 reads.
spawn_extensions = ["rs", "h", "hpp", "cpp", "cc", "cxx"]
# Process-start APIs F4 bans there; it looks for the last name in a file that also names the one before it, and for a
# rename of the one before it (`use std::process as sp`), which would hide the last name in other files.
banned_spawns = ["std::process::Command", "QProcess"]
# Build scripts, as paths inside their package; like tests and the test tools, they may start processes.
build_scripts = ["build.rs", "qtbuild.rs"]

[workspace.metadata.dco]
# Commit trailer that counts as a sign-off.
trailer = "Signed-off-by"
# Authors exempt from the DCO check.
exempt_authors = ["dependabot[bot]"]

[workspace.metadata.devtools]
# Subject of the self-signed test certificate that signs uiAccess test builds.
cert_subject = "CN=KeyXtend Dev Test"
# Days the test certificate stays valid.
cert_days = 90
# A certificate with fewer days left is replaced, so signed test builds never expire mid-test.
cert_min_days = 14
# Current-user certificate store that holds the test key.
user_store = "My"
# Folder, under the workspace root, for the exported certificate, launchers and temp files.
out_dir = "target/dev-tools"
# Exported public certificate file name.
cert_file = "keyxtend-dev.cer"
# Launcher the owner opens to trust the certificate.
trust_launcher = "trust-dev-cert.cmd"
# Launcher the owner opens to stop trusting it.
untrust_launcher = "untrust-dev-cert.cmd"
# Manifest file extracted by `check-uiaccess`.
manifest_file = "manifest.xml"
# File where the admin window leaves its error message for the terminal.
admin_error_file = "admin-error.txt"
# Folder, under the workspace root, holding the PowerShell scripts.
scripts_dir = "xtask/scripts"
# User-level certificate script: find, create, export or delete.
cert_script = "dev-cert.ps1"
# Admin-level script: trust, untrust, install or uninstall.
admin_script = "dev-admin.ps1"
# Env var naming the Windows folder, so PowerShell is never picked up from another folder.
shell_root_env = "SystemRoot"
# PowerShell program, relative to that Windows folder.
powershell = "System32/WindowsPowerShell/v1.0/powershell.exe"
# Folder name for test installs under Program Files.
install_dir = "KeyXtend-dev"
# Largest build folder `dev-install` copies to C:, in MB.
install_max_mb = 500
# Env vars naming the folders Windows accepts for uiAccess; the first one receives installs.
secure_env = ["ProgramFiles", "ProgramFiles(x86)"]
# Windows SDK bin folder holding one folder per SDK version.
sdk_bin = 'C:\Program Files (x86)\Windows Kits\10\bin'
# SDK tool architecture folder.
sdk_arch = "x64"
# SDK signing tool.
signtool = "signtool.exe"
# SDK manifest tool.
mt = "mt.exe"
# Signature digest algorithm.
digest = "SHA256"
# Manifest element that holds the uiAccess attribute.
ui_access_tag = "requestedExecutionLevel"
# Manifest attribute that grants uiAccess.
ui_access_attr = "uiAccess"
# Attribute value that turns uiAccess on.
ui_access_on = "true"
# Exit code the admin script returns when the owner cancels the Windows prompt.
cancel_code = 1223
# Exit code the admin script returns for any other failure.
fail_code = 1
# Env var naming the user's roaming folder, which holds their own Start menu; dev-install never uses the all-users one.
start_menu_env = "APPDATA"
# The user's Start-menu programs folder, under that folder.
start_menu_dir = "Microsoft/Windows/Start Menu/Programs"
# The shortcut dev-install adds there for an install that holds the app; `--remove` deletes it.
shortcut = "KeyXtend (dev).lnk"
# User-level shortcut script: add, find or remove that shortcut.
shortcut_script = "dev-shortcut.ps1"
# Env var naming the user's profile folder; the shortcut must land inside it.
profile_env = "USERPROFILE"

[workspace.metadata.stage]
# The app package `cargo xtask stage` builds in release; its program has the same name.
app = "keyxtend"
# The media worker package, built in release on its own and staged beside the app (ADR-0034); its program has the same
# name, which kx-platform-windows starts (`WORKER_EXE`, the app's agree test), and the stage refuses its manifest if it
# asks for uiAccess.
worker = "keyxtend-worker"
# Folder, under the workspace root, holding the stage; the app's own folder in it is emptied first.
out_dir = "target/stage"
# The download budget (ADR-0012), in MB of 10⁶ bytes: the staged files deflated at words.toml's `[packs] level`, a
# conservative stand-in for the installer's LZMA2; the installed size answers to `install_max_mb`. Spec §10 sets it; an
# xtask test checks.
max_mb = 80
# Env var naming Qt's qmake; Qt's folders come from `qmake -query`, so the stage takes the Qt the app was built with.
qmake_env = "QMAKE"
# The only Qt version the stage takes: the one THIRD_PARTY.md reviewed.
qt_version = "6.11.2"
# Qt libraries, from Qt's bin folder, staged beside the program; the stage check proves something imports each one.
libs = ["Qt6Core.dll", "Qt6Gui.dll", "Qt6Network.dll", "Qt6OpenGL.dll", "Qt6Qml.dll", "Qt6QmlMeta.dll", "Qt6QmlModels.dll", "Qt6QmlWorkerScript.dll", "Qt6Quick.dll", "Qt6QuickEffects.dll", "Qt6QuickShapes.dll", "Qt6Svg.dll"]
# Qt plugins, from Qt's plugins folder, staged in the same subfolders beside the program.
plugins = ["platforms/qwindows.dll", "imageformats/qsvg.dll"]
# Qt QML module files, from Qt's qml folder, staged in `qml_dir`. Measured: QtQml, Models and WorkerScript register
# from libraries Qt Quick loads, so of theirs only QtQml's qmldir ships, which QtQuick's qmldir imports.
qml = ["QtQml/qmldir", "QtQuick/qmldir", "QtQuick/qtquick2plugin.dll", "QtQuick/Effects/qmldir", "QtQuick/Effects/effectsplugin.dll", "QtQuick/Shapes/qmldir", "QtQuick/Shapes/qmlshapesplugin.dll"]
# Folder beside the program for Qt's QML modules; kx-ui pins the same one (the app's agree test).
qml_dir = "qml"
# Folders the stage check refuses anywhere: TLS, network-information and QML debugging plugins (ADR-0004).
banned = ["tls", "networkinformation", "qmltooling"]
# Qt's network library ships only because Qt Qml and Qt Quick import it (ADR-0013); any other importer is refused (ADR-0004).
network = { lib = "Qt6Network.dll", by = ["Qt6Qml.dll", "Qt6Quick.dll"] }
# Name prefixes of Windows API sets, which the loader maps without searching any folder.
api_sets = ["api-ms-", "ext-ms-"]
# Windows' system folder, under the folder `devtools.shell_root_env` names; an import found there resolves.
system_dir = "System32"
# The flag only the app's gate-only build (`gate-input`) takes; the check refuses a program holding its text. The app's agree test pins it.
gate_flag = "--sim-input"
# The word packs (ADR-0032) need no key here: the index, each pack it lists and the credits go from the folder that
# xtask/words.toml names (`[text] out`, `[credits]`) into kx-module-api's `PACK_DIR`, which the check refuses incomplete.

[workspace.metadata.sounds]
# The sound recipes, variant jitter and resampler that `cargo xtask sounds` reads, under the workspace root.
recipes = "assets/sounds/recipes.toml"
# The sound tokens whose `[format]` the tool writes in and kx-ui's build checks against, under the workspace root.
format = "crates/kx-theme/tokens/sounds.toml"
# Folder, under the workspace root, that `cargo xtask sounds render` writes to unless given `--out`.
out_dir = "target/sounds"

# `cargo xtask words` decompresses gigabytes of bzip2 text and checks every word with Hunspell, so these two run
# optimised in dev builds too. The full pack build still runs best in release, about six times faster.
[profile.dev.package.libbz2-rs-sys]
opt-level = 3

[profile.dev.package.spellbook]
opt-level = 3

# The stage deflates every staged file to measure the download, about 95 MB, so the deflater runs optimised too.
[profile.dev.package.miniz_oxide]
opt-level = 3

# The media worker must draw up to `max_pixels` within the host's deadline (`media_ms`) in dev builds too, and its
# tests scale a 48-megapixel image, so it and its PNG decoder run optimised.
[profile.dev.package.keyxtend-worker]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
