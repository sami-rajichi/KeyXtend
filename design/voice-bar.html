<!doctype html>
<!--
Mock-up of voice typing (P11, spec 2026-11-10-voice-typing-design.md): the dictation bar in each state and every page of the
Voice panel, in the three themes, light and soft dark, in English, French and Arabic. Reference only, never shipped.
The owner saw the first picture (Listening bar, panel home) on 2026-11-10; this file adds the rest for the owner's yes
before any QML. Texts, sample data and drawing are in voice-bar.js beside it.

Which reference each choice follows:
- The bar as one pill with a live wave of the real sound level: Wispr Flow's dictation bar and ChatGPT's dictation mode.
- Cancel at the left end and a filled Stop at the right end, the strongest button last: ChatGPT's and Gemini's microphones
  (Stop is a dark disc with a square in both); the owner's 2026-11-10 picture.
- "Listening…" in words and a settings gear on the bar: Windows voice typing (Win+H).
- The red dot that pulses while the microphone is open: the style lab's caption .rec-dot (themes.toml [common] rec_dot).
- The shimmer while the words are on their way: Gemini's and ChatGPT's loading shimmer (style lab .shimmer).
- Text and Note states, one line plus one action, then the bar fades: a Material Design snackbar and the Windows 11 InfoBar.
- A button that cannot act shows dimmed, never hidden, so nothing moves under the finger: the clipboard panel's footer
  (ClipFoot.qml). So Transcribing keeps a dimmed Stop where Stop was.
- Password box shows dots: Windows' password box; the dot spacing is Quick-fill's mask (shape.toml [fill] mask_em).
- The panel frame, tick boxes, page buttons, note band, storage line and footer with Insert in Enter's colours: KeyXtend's
  own clipboard panel (ClipPanel.qml, shape.toml [panel] and [clip]).
- Models: a download row with progress, Pause and Cancel on the row, as Microsoft Store's downloads.
- Device: Automatic beside the processor and each card by name, as Windows Settings > Display > Graphics.
- Compare results: the columns of the owner's own trial table (docs/items/P11.md): model, words wrong, wait, memory.
- Options: switches with On or Off beside them, as Windows Settings' toggles; minus and plus steppers, never a slider.
- Reduced motion: the wave becomes a plain level bar, as the input meter in Windows Settings > Sound.
Every colour, radius and size is a token copied below from crates/kx-theme/tokens/*.toml, named after it. Sizes marked
"proposed" are not in shape.toml yet; task 24 adds them as [voice]. The app window and wall behind are the scene's
stand-ins, copied from selection-chips.html.
-->

  --voice-bar-w:500; --voice-bar-w-text:640; --voice-wave-px-0:4; --voice-wave-px-1:3; --voice-wave-px-2:3;
  --voice-progress-px:4; --voice-switch-px-0:40; --voice-switch-px-1:22; --voice-switch-px-2:12; --voice-value-px:92; --voice-text-lines:2;

/* The scene's stand-ins, copied from selection-chips.html: the wall and the app behind the keyboard. */
[data-mode="light"]{--wall:#C6CFD6; --a-bg:#FFFFFF; --a-ink:#1B1B1B; --a-top:#F3F3F3; --a-mute:#5F5F5F; --a-line:#00000014}
[data-mode="dark"]{--wall:#191C20; --a-bg:#202124; --a-ink:#E6E6E6; --a-top:#2B2C2F; --a-mute:#A9AEB5; --a-line:#FFFFFF14}

/* The page: controls on top, the scene scaled to fit below, no page scroll (selection-chips.html). */
html,body{height:100%}
body{margin:0; overflow:hidden; background:var(--pop-bg); color:var(--pop-ink); font:13px/1.35 var(--latin-fonts); box-sizing:border-box;
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display:flex; flex-direction:column; gap:8px}
#ctl{flex:none; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:flex-end}
.grp{display:flex; flex-direction:column; gap:3px; min-width:0}
.grp>b{font-size:11px; font-weight:600; color:var(--pop-muted); letter-spacing:.02em}
.opts{display:flex; flex-wrap:wrap; gap:3px}
.o{min-height:34px; padding:0 11px; border:var(--line-px) solid var(--pop-line); border-radius:calc(var(--key-radius-px) * 1px); background:transparent; color:var(--pop-ink); font:inherit; font-weight:500; cursor:pointer}
.o:hover{background:var(--pop-hover)}
.o[aria-pressed="true"]{background:var(--pop-sel); border-color:var(--ring)}
.o:focus-visible,.sc button:focus-visible,.sc [role="button"]:focus-visible{outline:2px solid var(--ring); outline-offset:1px}
#say{flex:none; min-height:18px; color:var(--pop-muted); max-width:110ch}
#say strong{color:var(--pop-ink); font-weight:600}
#fit{flex:1; min-height:0; position:relative; overflow:hidden; border-radius:calc(var(--window-radius-px) * 1px)}
#stage{position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; background:var(--wall)}
.i{display:block; flex:none; width:1em; height:1em}
.ar{font-family:var(--arabic-fonts)}
.sc button{font:inherit; color:inherit; margin:0}

/* The app behind (selection-chips.html .app). */
.app{position:absolute; left:20px; right:20px; top:14px; background:var(--a-bg); color:var(--a-ink); border-radius:8px; box-shadow:0 8px 24px #00000038, 0 0 0 1px var(--a-line); overflow:hidden; font-family:"Segoe UI",sans-serif; display:flex; flex-direction:column}
.a-t{flex:none; height:32px; background:var(--a-top); display:flex; align-items:center; padding:0 12px; font-size:12px; color:var(--a-mute)}
.a-b{flex:1; min-height:0; padding:18px 24px; font-size:15.5px; line-height:1.65}
.a-b p{margin:0 0 10px}
.a-b .new{background:var(--a-line)}
.a-f{display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--a-line); padding:6px 0; margin-bottom:10px; max-width:420px}
.a-f span:first-child{color:var(--a-mute); min-width:110px}
.caret{display:inline-block; width:1.5px; height:1.15em; background:var(--a-ink); vertical-align:text-bottom; animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* The keyboard (selection-chips.html .kb, .key, .cap); its geometry is the mock-up's, its colours and corners the theme's. */
.kb{position:absolute; --ku:calc(33px * var(--s)); --kh:calc(var(--key-row-px) * var(--u)); --gp:calc(var(--gap-px) * var(--u)); background:var(--plate); border-radius:calc(var(--window-radius-px) * var(--u));
  padding:calc(6 * var(--u)) calc(7 * var(--u)) calc(7 * var(--u)); box-shadow:var(--window-shadow); font-family:var(--latin-fonts); color:var(--legend)}
.kb-top{display:flex; align-items:center; gap:calc(4 * var(--u)); height:calc(24 * var(--u)); margin-bottom:calc(4 * var(--u))}
.lane{flex:1; min-width:0; display:flex; gap:calc(var(--chip-gap-px) * var(--u))}
.wchip{height:calc(var(--chip-height-px) * var(--u)); padding:0 calc(var(--chip-pad-px) * var(--u)); border-radius:calc(var(--key-radius-px) * .8 * var(--u)); background:var(--chip-bg); color:var(--legend); font:var(--chip-weight) calc(var(--chip-font-px-0) * var(--u))/1 var(--latin-fonts); display:inline-flex; align-items:center}
.wchip.ar{font-family:var(--arabic-fonts); font-size:calc(var(--chip-font-px-1) * var(--u))}
.tb{width:calc(24 * var(--u)); height:calc(22 * var(--u)); color:var(--legend-2); display:grid; place-items:center; font-size:calc(14 * var(--u))}
.kb-body{display:flex; gap:calc(8 * var(--u))}
.kb-main{width:calc(var(--ku) * 16); display:grid; grid-template-rows:repeat(5, var(--kh))}
.row{display:grid; grid-template-columns:repeat(64, minmax(0, 1fr)); min-height:0}
.kb-side{display:grid; grid-template-columns:repeat(3, calc(var(--ku) * 1.22)); grid-template-rows:repeat(5, var(--kh))}
.dpad .d{position:absolute; display:grid; place-items:center}
.dpad .up{top:7%; left:50%; transform:translateX(-50%)} .dpad .bt{bottom:7%; left:50%; transform:translateX(-50%)}
.dpad .lf{left:7%; top:50%; transform:translateY(-50%)} .dpad .rt{right:7%; top:50%; transform:translateY(-50%)}
.key{padding:calc(var(--gp) / 2); min-width:0; min-height:0; --top:var(--key); --ink:var(--legend); --sk:var(--skirt-key, var(--key))}
.key.mod,.key.lang{--top:var(--key-mod); --ink:var(--legend-mod); --sk:var(--skirt-key-mod, var(--key-mod))}
.key.act{--top:var(--key-act); --ink:var(--legend-act); --sk:var(--skirt-key-mod, var(--key-act))}
.key.enter{--top:var(--enter); --ink:var(--enter-ink); --sk:var(--skirt-enter, var(--enter))}
.key.danger{--top:var(--danger); --ink:var(--danger-ink); --sk:var(--skirt-danger, var(--danger))}
.key.rec{--top:var(--rec); --ink:var(--rec-ink); --sk:var(--skirt-rec, var(--rec))}
.cap{position:relative; display:flex; align-items:center; justify-content:center; gap:calc(4 * var(--u)); width:100%; height:100%; overflow:hidden; background:var(--top); color:var(--ink);
  border-radius:calc(var(--key-radius-px) * var(--u)); box-shadow:var(--key-shadow); box-sizing:border-box; font-size:calc(14 * var(--u))}
.cap>*{position:relative; z-index:1}
.key.rec .cap{animation:glow var(--glow-ms) var(--ease-in-out) infinite}
@keyframes glow{50%{filter:brightness(var(--glow-lift))}}
.lg{font-size:calc(var(--legend-px) * var(--u)); font-weight:var(--legend-weight); line-height:1}
.lg.ar{font-family:var(--arabic-fonts); font-size:calc(var(--legend-px) * var(--arabic-scale) * var(--u))}
.lbl{font-size:calc(var(--mod-legend-px) * var(--u)); line-height:1; white-space:nowrap}
.spn{font-size:calc(10.5 * var(--u)); color:var(--legend-2); white-space:nowrap}
.spn.ar{font-family:var(--arabic-fonts); font-size:calc(11.5 * var(--u))}
[data-theme="et66"] .cap{background:linear-gradient(180deg, color-mix(in srgb, var(--top) 93%, #fff) 0%, var(--top) 55%, color-mix(in srgb, var(--top) 93%, #000) 100%)}
[data-theme="dolch"] .cap{background:var(--sk)}
[data-theme="dolch"] .cap::before{content:""; position:absolute; z-index:0; inset:var(--u) calc(3 * var(--u)) calc(4 * var(--u)); border-radius:calc(4 * var(--u)); background:linear-gradient(180deg, color-mix(in srgb, var(--top) 88%, #fff), var(--top) 70%)}

/* The dictation bar: one key row tall, a pill in the keyboard's theme. */
.vbar{position:absolute; z-index:30; box-sizing:border-box; width:calc(var(--voice-bar-w) * var(--u)); min-height:calc(var(--caption-bar-px) * var(--u)); padding:calc(var(--chips-pad-px) * var(--u));
  display:flex; align-items:center; gap:calc(var(--caption-gap-px) * var(--u)); border-radius:999px; background:var(--pop-bg); color:var(--pop-ink); box-shadow:var(--window-shadow);
  font:var(--caption-status-weight) calc(var(--caption-status-px) * var(--u))/1.3 var(--latin-fonts)}
.vbar.wide{width:calc(var(--voice-bar-w-text) * var(--u)); border-radius:calc(var(--caption-words-radius-px) * var(--u))}
.vbar.in{animation:rise var(--caption-ms) var(--ease-out)}
@keyframes rise{from{opacity:0; transform:translateY(calc(var(--pop-rise-px) * var(--u))) scale(var(--pop-scale))}}
.vb{flex:none; box-sizing:border-box; width:calc(var(--clip-button-px-0) * var(--u)); height:calc(var(--clip-button-px-0) * var(--u)); border-radius:50%; padding:0; cursor:pointer;
  border:var(--line-px) solid var(--pop-line); background:var(--pop-hover); color:var(--pop-ink); display:grid; place-items:center; font-size:calc(var(--caption-icon-px) * var(--u))}
