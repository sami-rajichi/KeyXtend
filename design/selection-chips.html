<style>
/* One screen, no scroll: controls on top, the scene scaled to fit below. Every colour comes from KeyXtend's themes.toml. */
html,body{height:100%}
body{margin:0; overflow:hidden; background:var(--pop-bg,#F9F9F9); color:var(--pop-ink,#1B1B1B); font:13px/1.35 var(--f-latin,"Segoe UI",sans-serif);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px;
  display:flex; flex-direction:column; gap:8px; box-sizing:border-box}
#bar{flex:none; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:flex-end}
.grp{display:flex; flex-direction:column; gap:3px; min-width:0}
.grp>b{font-size:11px; font-weight:600; color:var(--pop-muted); letter-spacing:.02em}
.opts{display:flex; flex-wrap:wrap; gap:3px}
.o{min-height:34px; padding:0 11px; border:1px solid var(--pop-line); border-radius:var(--r-key); background:transparent; color:var(--pop-ink); font:inherit; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:5px}
.o:hover{background:var(--pop-hover)}
.o[aria-pressed="true"]{background:var(--pop-sel); border-color:var(--ring)}
.o:focus-visible{outline:2px solid var(--ring); outline-offset:1px}
#say{flex:none; min-height:18px; color:var(--pop-muted); max-width:90ch}
#say strong{color:var(--pop-ink); font-weight:600}
#fit{flex:1; min-height:0; position:relative; overflow:hidden; border-radius:var(--r-win)}
#stage{position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; border-radius:var(--r-win); background:var(--wall)}
.i{display:block; flex:none}

/* The app behind the keyboard. */
.app{position:absolute; left:20px; right:20px; top:14px; background:var(--a-bg); color:var(--a-ink); border-radius:8px; box-shadow:0 8px 24px #00000038, 0 0 0 1px var(--a-line); overflow:hidden; font-family:"Segoe UI",sans-serif; display:flex; flex-direction:column}
.a-t{flex:none; height:32px; background:var(--a-top); display:flex; align-items:center; gap:8px; padding:0 12px; font-size:12px; color:var(--a-mute)}
.a-t .sp{flex:1}
.a-b{flex:1; min-height:0; padding:18px 24px; font-size:15.5px; line-height:1.65; position:relative}
.a-b p{margin:0 0 10px}
.a-b h2{font:600 22px/1.25 "Segoe UI",sans-serif; margin:0 0 10px}
.a-url{flex:none; height:30px; display:flex; align-items:center; padding:0 12px; font-size:12px; color:var(--a-mute); border-bottom:1px solid var(--a-line)}
.field{display:flex; gap:10px; padding:4px 0; border-bottom:1px solid var(--a-line); font-size:13.5px; margin-bottom:8px}
.field span:first-child{color:var(--a-mute)}
.sel{background:var(--a-sel); color:var(--a-seli)}
.web .sel{background:var(--a-selw); color:inherit}
.caret{display:inline-block; width:1.5px; height:1.15em; background:var(--a-ink); vertical-align:text-bottom; animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
[dir="rtl"]{font-family:"Segoe UI","Noto Sans Arabic",sans-serif}

/* The keyboard, as the product draws it (mock-up .kb, .key, .cap). */
.kb{position:absolute; bottom:14px; left:50%; transform:translateX(-50%); --u:calc(33px*var(--s)); --h:calc(31px*var(--s)); --gp:calc(var(--g)*1px*var(--s));
  background:var(--plate); border-radius:var(--r-win); padding:calc(6px*var(--s)) calc(7px*var(--s)) calc(7px*var(--s)); box-shadow:var(--win-shadow); font-family:var(--f-latin); color:var(--legend)}
.kb-top{display:flex; align-items:center; gap:calc(4px*var(--s)); height:calc(24px*var(--s)); margin-bottom:calc(4px*var(--s))}
.lane{flex:1; min-width:0; display:flex; gap:calc(4px*var(--s))}
.wchip{height:calc(20px*var(--s)); padding:0 calc(9px*var(--s)); border-radius:calc(var(--r-key)*.8); background:var(--chip-bg); color:var(--legend); font:500 calc(11.5px*var(--s))/1 var(--f-latin); display:inline-flex; align-items:center}
.wchip.ar{font-family:var(--f-arabic); font-size:calc(12.5px*var(--s))}
.tb{width:calc(24px*var(--s)); height:calc(22px*var(--s)); color:var(--legend-2); display:grid; place-items:center}
.kb-body{display:flex; gap:calc(8px*var(--s))}
.kb-main{width:calc(var(--u)*16); display:grid; grid-template-rows:repeat(5,var(--h))}
.row{display:grid; grid-template-columns:repeat(64,minmax(0,1fr)); min-height:0}
.kb-side{display:grid; grid-template-columns:repeat(3,calc(var(--u)*1.22)); grid-template-rows:repeat(5,var(--h))}
.dpad .d{position:absolute; display:grid; place-items:center}
.dpad .up{top:7%; left:50%; transform:translateX(-50%)}
.dpad .bt{bottom:7%; left:50%; transform:translateX(-50%)}
.dpad .lf{left:7%; top:50%; transform:translateY(-50%)}
.dpad .rt{right:7%; top:50%; transform:translateY(-50%)}
.key{padding:calc(var(--gp)/2); min-width:0; min-height:0; --top:var(--key); --ink:var(--legend)}
.key.mod,.key.lang{--top:var(--key-mod); --ink:var(--legend-mod)}
.key.act{--top:var(--key-act); --ink:var(--legend-act)}
.key.enter{--top:var(--enter); --ink:var(--enter-ink)}
.key.danger{--top:var(--danger); --ink:var(--danger-ink)}
.cap{position:relative; display:flex; align-items:center; justify-content:center; gap:calc(4px*var(--s)); width:100%; height:100%; overflow:hidden; background:var(--top); color:var(--ink); border-radius:var(--r-key); box-shadow:var(--key-shadow); box-sizing:border-box}
.cap>*{position:relative; z-index:1}
.lg{font-size:calc(var(--fs)*var(--s)); font-weight:var(--fw); line-height:1}
.lg.ar{font-family:var(--f-arabic); font-size:calc(var(--fs)*var(--ar)*var(--s))}
.lbl{font-size:calc(var(--fs-mod)*var(--s)); line-height:1; white-space:nowrap}
.spn{font-size:calc(10.5px*var(--s)); color:var(--legend-2); white-space:nowrap}
.spn.ar{font-family:var(--f-arabic); font-size:calc(11.5px*var(--s))}
[data-style="et66"] .cap{background:linear-gradient(180deg,color-mix(in srgb,var(--top) 93%,#fff) 0%,var(--top) 55%,color-mix(in srgb,var(--top) 93%,#000) 100%)}
[data-style="dolch"] .key{--sk:var(--key-sk)}
[data-style="dolch"] .key.mod,[data-style="dolch"] .key.lang,[data-style="dolch"] .key.act{--sk:var(--mod-sk)}
[data-style="dolch"] .key.enter{--sk:var(--enter-sk)}
[data-style="dolch"] .key.danger{--sk:var(--danger-sk)}
[data-style="dolch"] .cap{background:var(--sk)}
[data-style="dolch"] .cap::before{content:""; position:absolute; z-index:0; inset:calc(1px*var(--s)) calc(3px*var(--s)) calc(4px*var(--s)); border-radius:calc(4px*var(--s)); background:linear-gradient(180deg,color-mix(in srgb,var(--top) 88%,#fff),var(--top) 70%)}

/* The chips: five designs over the same buttons. */
.chips{position:absolute; z-index:40; display:flex; align-items:stretch; font-family:var(--f-latin); animation:popIn .18s cubic-bezier(.2,.8,.2,1)}
@keyframes popIn{from{opacity:0; transform:translateY(calc(6px*var(--s))) scale(.98)}}
@media (prefers-reduced-motion:reduce){.chips{animation:none}.caret{animation:none}}
.chips.go{opacity:0; transform:translateY(calc(-3px*var(--s))); transition:opacity .16s,transform .16s}
.c{border:0; background:transparent; color:inherit; font:inherit; padding:0; margin:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; position:relative}
.c:focus-visible{outline:2px solid currentColor; outline-offset:-2px}
.c .w.ar{font-family:var(--f-arabic); font-size:calc(1em*var(--ar))}

/* 1 and 2 and 3: the mode badge's pill (mock-up .selpill), in the badge's colours. */
.d-pill,.d-word,.d-icon{height:calc(31px*var(--s)); box-sizing:border-box; padding:calc(3px*var(--s)); gap:calc(2px*var(--s)); border-radius:999px; background:var(--badge-bg); color:var(--badge-ink); box-shadow:0 3px 10px #00000047; font-weight:600; font-size:calc(12px*var(--s))}
.d-pill .c,.d-word .c,.d-icon .c{border-radius:999px}
.d-pill .c:hover,.d-word .c:hover,.d-icon .c:hover{background:#7F7F7F38}
.d-pill .c{gap:calc(5px*var(--s)); padding:0 calc(11px*var(--s))}
.d-pill .i{width:calc(13px*var(--s)); height:calc(13px*var(--s))}
.d-word .c{padding:0 calc(14px*var(--s))}
.d-icon .c{width:calc(40px*var(--s))}
.d-icon .i{width:calc(16px*var(--s)); height:calc(16px*var(--s))}
.tip{position:absolute; bottom:calc(100% + 6px*var(--s)); left:50%; transform:translateX(-50%); background:var(--pop-bg); color:var(--pop-ink); border-radius:var(--r-key); padding:calc(3px*var(--s)) calc(7px*var(--s)); box-shadow:0 2px 8px #0000003D; font-size:calc(11px*var(--s)); font-weight:500; opacity:0; pointer-events:none}
.c:hover .tip{opacity:1}

/* 4: a slice of the keyboard itself, its plate and its caps. */
.d-keys{background:var(--plate); border-radius:var(--r-win); padding:calc(3px*var(--s)); box-shadow:var(--win-shadow); gap:0}
.d-keys .key{padding:calc(var(--gp)/2); height:calc(31px*var(--s)); box-sizing:border-box}
.d-keys .c{padding:0 calc(10px*var(--s)); gap:calc(5px*var(--s)); font-size:calc(11.5px*var(--s)); font-weight:var(--fw); width:100%; height:100%}
.d-keys .c.cap{display:flex}
.d-keys .i{width:calc(13px*var(--s)); height:calc(13px*var(--s))}
.d-keys .key:hover .cap{filter:brightness(1.04)}
.d-keys .key:active .cap{transform:translateY(calc(1px*var(--s))) scale(.97); filter:brightness(.94)}

/* 5: the clipboard panel's surface. */
.d-panel{height:calc(32px*var(--s)); background:var(--pop-bg); color:var(--pop-ink); border-radius:var(--r-win); box-shadow:var(--win-shadow); padding:calc(3px*var(--s)); gap:calc(1px*var(--s)); font-size:calc(12px*var(--s)); font-weight:500; box-sizing:border-box}
.d-panel .c{gap:calc(6px*var(--s)); padding:0 calc(10px*var(--s)); border-radius:calc(var(--r-key)*.9)}
.d-panel .c:hover{background:var(--pop-hover)}
.d-panel .i{width:calc(14px*var(--s)); height:calc(14px*var(--s)); color:var(--ring)}
.d-panel .c+.c::before{content:""; position:absolute; left:calc(-1px*var(--s)); top:22%; bottom:22%; width:1px; background:var(--pop-line)}
</style>

    rows:[['`','1','2','3','4','5','6','7','8','9','0','-','='],['q','w','e','r','t','y','u','i','o','p','[',']','\\'],['a','s','d','f','g','h','j','k','l',';',"'"],['<','z','x','c','v','b','n','m',',','.','/']],
    keys:{esc:'Esc',del:'Del',caps:'Caps',ctrl:'Ctrl',alt:'Alt',altgr:'AltGr'},
    note:['Dear Maya,','The meeting moved to Thursday at ten. ','Please bring the signed form',' and the two copies we talked about.','See you then,'],
    title:'Notes', web:['Why the evening train is quieter','Trains after eight carry a third of the morning crowd, so ','the ride is calmer',' and seats are easy to find.'], url:'example.org/evening-trains',
    mail:['To','maya@example.org','Subject','Thursday','Hello Maya,'], mailTitle:'New message'},
  fr:{name:'FR', sp:'Français (France)', lang:'FR', ar:false, words:['le','et','merci'],
    chips:{copy:'Copier',cut:'Couper',paste:'Coller',translate:'Traduire'}, done:{copy:'Copié',cut:'Coupé',paste:'Collé',translate:'Ouverture'},
    rows:[['²','&','é','"',"'",'(','-','è','_','ç','à',')','='],['a','z','e','r','t','y','u','i','o','p','^','$','*'],['q','s','d','f','g','h','j','k','l','m','ù'],['<','w','x','c','v','b','n',',',';',':','!']],
    keys:{esc:'Échap',del:'Suppr',caps:'Verr. Maj',ctrl:'Ctrl',alt:'Alt',altgr:'Alt Gr'},
    note:['Bonjour Maya,','La réunion est déplacée à jeudi à dix heures. ','Merci d’apporter le formulaire signé',' et les deux copies dont nous avons parlé.','À bientôt,'],
    title:'Notes', web:['Pourquoi le train du soir est plus calme','Les trains après vingt heures transportent un tiers de la foule du matin : ','le trajet est plus calme',' et il est facile de trouver une place.'], url:'example.org/trains-du-soir',
    mail:['À','maya@example.org','Objet','Jeudi','Bonjour Maya,'], mailTitle:'Nouveau message'},
  ar:{name:'ع', sp:'العربية', lang:'ع', ar:true, words:['في','من','على'],
    chips:{copy:'نسخ',cut:'قص',paste:'لصق',translate:'ترجمة'}, done:{copy:'تم النسخ',cut:'تم القص',paste:'تم اللصق',translate:'جارٍ الفتح'},
    rows:[['ذ','1','2','3','4','5','6','7','8','9','0','-','='],['ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج','د','\\'],['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],['|','ئ','ء','ؤ','ر','لا','ى','ة','و','ز','ظ']],
    keys:{esc:'Esc',del:'Del',caps:'Caps',ctrl:'Ctrl',alt:'Alt',altgr:'AltGr'},
    note:['عزيزتي مايا،','نُقل الاجتماع إلى يوم الخميس الساعة العاشرة. ','يُرجى إحضار الاستمارة الموقّعة',' والنسختين اللتين تحدثنا عنهما.','إلى اللقاء،'],
    title:'ملاحظات', web:['لماذا قطار المساء أهدأ','تنقل القطارات بعد الثامنة مساءً ثلث ركاب الصباح، لذلك ','تكون الرحلة أهدأ',' ويسهل إيجاد مقعد.'], url:'example.org/evening-trains',
    mail:['إلى','maya@example.org','الموضوع','الخميس','مرحبًا مايا،'], mailTitle:'رسالة جديدة'}
};

const DESIGNS = {
  pill:{label:'1 Icon + word', say:'<strong>Icon and word in one pill.</strong> Your mock-up’s pill, grown to three buttons, in the same colours as the pointer’s mode badge. Android’s selection toolbar has this shape.'},
  word:{label:'2 Word only', say:'<strong>Words only.</strong> The calmest and narrowest with words, in the badge colours. Close to the phone edit menus; you read each word instead of spotting an icon.'},
  icon:{label:'3 Icon only', say:'<strong>Icons only.</strong> The smallest. Each button is wide and easy to hit, and the word shows as a tip when the pointer rests on it. You need to know the icons.'},
  keys:{label:'4 Keycaps', say:'<strong>A slice of your keyboard.</strong> Real keycaps on the keyboard’s plate, so each theme changes the chips with it: flat in Native, rounded in ET66, sculpted in Dolch.'},
  panel:{label:'5 Panel', say:'<strong>The clipboard panel’s surface.</strong> A quiet bar with coloured icons and thin dividers, matching your clipboard and Quick-fill panels.'}
};
const SCENES = {note:'Selected text', web:'Web page', caret:'Caret in a box'};
const SIZES = [['S',1],['M',1.25],['L',1.5]];

const S = {design:'keys', theme:'native', mode:'light', scene:'note', lang:'en', size:1, tr:false, hidden:false};
try { const k = JSON.parse(localStorage.getItem('kx-chips') || '{}'); Object.assign(S, k, {hidden:false}); } catch (e) {}
const save = () => { try { localStorage.setItem('kx-chips', JSON.stringify(S)); } catch (e) {} };

const $ = id => document.getElementById(id);
const ctl = (label, opts, cur, set) => '<div class="grp"><b>' + label + '</b><div class="opts">' +
  opts.map(([v, t]) => '<button class="o" aria-pressed="' + (String(v) === String(cur)) + '" data-k="' + set + '" data-v="' + v + '">' + t + '</button>').join('') + '</div></div>';

function bar() {
  $('bar').innerHTML =
    ctl('Design', Object.entries(DESIGNS).map(([k, d]) => [k, d.label]), S.design, 'design') +
    ctl('Theme', Object.entries(T).map(([k, t]) => [k, t.name]), S.theme, 'theme') +
    ctl('Light or dark', [['light','Light'],['dark','Dark']], S.mode, 'mode') +
    ctl('Scene', Object.entries(SCENES), S.scene, 'scene') +
    ctl('Language', Object.entries(L).map(([k, l]) => [k, l.name]), S.lang, 'lang') +
    ctl('Keyboard size', SIZES.map(([n, v]) => [v, n]), S.size, 'size') +
    ctl('Translate chip', [[0,'Off'],[1,'On']], S.tr ? 1 : 0, 'tr') +
    '<div class="grp"><b>Chips gone?</b><div class="opts"><button class="o" id="again">Show again</button></div></div>';
}

function vars() {
  const t = T[S.theme], p = t[S.mode], r = document.documentElement.style;
  const light = S.mode === 'light';
  const set = {
    '--plate':p.plate,'--key':p.key,'--key-mod':p.keyMod,'--key-act':p.keyAct,'--enter':p.enter,'--enter-ink':p.enterInk,'--danger':p.danger,'--danger-ink':p.dangerInk,
    '--legend':p.legend,'--legend-mod':p.legendMod,'--legend-2':p.legend2,'--legend-act':p.legendAct,'--ring':p.ring,'--badge-bg':p.badgeBg,'--badge-ink':p.badgeInk,
    '--pop-bg':p.popBg,'--pop-ink':p.popInk,'--pop-muted':p.popMuted,'--pop-line':p.popLine,'--pop-hover':p.popHover,'--pop-sel':p.popSel,'--chip-bg':p.chipBg,
    '--key-shadow':p.keyShadow,'--win-shadow':p.winShadow,'--key-sk':p.keySk||p.key,'--mod-sk':p.modSk||p.keyMod,'--enter-sk':p.enterSk||p.enter,'--danger-sk':p.dangerSk||p.danger,
    '--r-key':t.rKey+'px','--r-win':t.rWin+'px','--g':t.g,'--fs':t.fs+'px','--fs-mod':t.fsMod+'px','--fw':t.fw,'--ar':t.ar,'--f-latin':t.latin,'--f-arabic':t.arabic,'--s':S.size,
    '--wall':light?'#C6CFD6':'#191C20','--a-bg':light?'#FFFFFF':'#202124','--a-ink':light?'#1B1B1B':'#E6E6E6','--a-top':light?'#F3F3F3':'#2B2C2F','--a-mute':light?'#5F5F5F':'#A9AEB5','--a-line':light?'#00000014':'#FFFFFF14',
    '--a-sel':'#0078D4','--a-seli':'#FFFFFF','--a-selw':light?'#B3D7FF':'#264F78'
  };
  for (const k in set) r.setProperty(k, set[k]);
  r.setProperty('color-scheme', light ? 'light' : 'dark');
  document.body.style.fontFamily = t.latin;
}

const keyEl = (w, cls, inner) => '<div class="key ' + cls + '" style="grid-column:span ' + Math.round(w*4) + '"><div class="cap">' + inner + '</div></div>';
function keyboard() {
  const l = L[S.lang], c = (t, a) => keyEl(1, 'char', '<span class="lg' + (a && /[\u0600-\u06FF]/.test(t) ? ' ar' : '') + '">' + t.replace('<','&lt;') + '</span>');
  const row = a => a.map(t => c(t, l.ar)).join('');
  const lb = t => '<span class="lbl">' + t + '</span>';
  const side = [
    ['mouse-right',1,1,'act'],['hand-grab',2,1,'act'],['command',3,1,'act'],
    ['clipboard-clock',3,3,'act'],
    ['key-round',1,5,'act'],['mic',2,5,'act'],['power',3,5,'danger']];
  return '<div class="kb"><div class="kb-top"><div class="lane">' + l.words.map(w => '<span class="wchip' + (l.ar?' ar':'') + '">' + w + '</span>').join('') + '</div>' +
    '<span class="tb">' + ic('minus').replace('class="i"','class="i" width="'+14*S.size+'" height="'+14*S.size+'"') + '</span><span class="tb">' + ic('x').replace('class="i"','class="i" width="'+14*S.size+'" height="'+14*S.size+'"') + '</span></div>' +
    '<div class="kb-body"><div class="kb-main">' +
    '<div class="row">' + keyEl(1,'danger',lb(l.keys.esc)) + row(l.rows[0]) + keyEl(2,'danger',icK('delete')) + '</div>' +
    '<div class="row">' + keyEl(1.5,'mod',icK('arrow-right-to-line')) + row(l.rows[1]) + keyEl(1.5,'mod',lb(l.keys.del)) + '</div>' +
    '<div class="row">' + keyEl(1.75,'mod',lb(l.keys.caps)) + row(l.rows[2]) + keyEl(3.25,'enter',icK('corner-down-left')) + '</div>' +
    '<div class="row">' + keyEl(1.25,'mod',icK('arrow-big-up')) + row(l.rows[3]) + keyEl(1.75,'mod',icK('arrow-big-up')) + keyEl(1,'mod',icK('chevron-up')) + keyEl(1,'mod',icK('square-menu')) + '</div>' +
    '<div class="row">' + keyEl(1.25,'mod',lb(l.keys.ctrl)) + keyEl(1,'mod',icK('win-logo')) + keyEl(1,'mod',lb(l.keys.alt)) + keyEl(1.75,'lang','<span class="lbl' + (l.ar?' ar':'') + '" style="' + (l.ar?'font-family:var(--f-arabic)':'') + '">' + l.lang + '</span>') + keyEl(7,'space','<span class="spn' + (l.ar?' ar':'') + '">' + l.sp + '</span>') + keyEl(1,'mod',lb(l.keys.altgr)) + keyEl(1,'mod',icK('chevron-left')) + keyEl(1,'mod',icK('chevron-down')) + keyEl(1,'mod',icK('chevron-right')) + '</div>' +
    '</div><div class="kb-side"><div class="key act" style="grid-column:1/3;grid-row:2/5"><div class="cap dpad"><span class="d up">' + icK('chevron-up') + '</span><span class="d lf">' + icK('chevron-left') + '</span><span class="d rt">' + icK('chevron-right') + '</span><span class="d bt">' + icK('chevron-down') + '</span></div></div>' + side.map(([n,cx,ry,k]) => '<div class="key ' + k + '" style="grid-column:' + cx + ';grid-row:' + ry + '"><div class="cap">' + icK(n) + '</div></div>').join('') + '</div></div></div>';
}
const icK = n => ic(n).replace('class="i"', 'class="i" width="' + 14*S.size + '" height="' + 14*S.size + '"');

function app(h) {
  const l = L[S.lang], dir = l.ar ? ' dir="rtl"' : '';
  let top, body;
  if (S.scene === 'web') {
    top = '<div class="a-t"><span>' + l.web[0] + '</span></div><div class="a-url"><span dir="ltr">' + l.url + '</span></div>';
    body = '<div class="a-b web"' + dir + '><h2>' + l.web[0] + '</h2><p>' + l.web[1] + '<span class="sel" id="anchor">' + l.web[2] + '</span>' + l.web[3] + '</p></div>';
  } else if (S.scene === 'caret') {
    top = '<div class="a-t"><span>' + l.mailTitle + '</span></div>';
    body = '<div class="a-b"' + dir + '><div class="field"><span>' + l.mail[0] + '</span><span dir="ltr">' + l.mail[1] + '</span></div><div class="field"><span>' + l.mail[2] + '</span><span>' + l.mail[3] + '</span></div><p>' + l.mail[4] + '</p><p><span class="caret" id="anchor"></span></p></div>';
  } else {
    top = '<div class="a-t"><span>' + l.title + '</span></div>';
    body = '<div class="a-b"' + dir + '><p>' + l.note[0] + '</p><p>' + l.note[1] + '<span class="sel" id="anchor">' + l.note[2] + '</span>' + l.note[3] + '</p><p>' + l.note[4] + '</p></div>';
  }
  return '<div class="app" style="height:' + h + 'px">' + top + body + '</div>';
}

// The chips this scene offers: a read-only page has nothing to cut or paste into, and a caret only takes Paste.
function chipList() {
  if (S.scene === 'caret') return ['paste'];
  const a = S.scene === 'web' ? ['copy'] : ['copy','cut','paste'];
  if (S.tr) a.push('translate');
  return a;
}
const ICON = {copy:'copy', cut:'scissors', paste:'clipboard-paste', translate:'languages'};

function chips() {
  if (S.hidden) return '';
  const l = L[S.lang], w = t => '<span class="w' + (l.ar ? ' ar' : '') + '">' + t + '</span>';
  const inner = id => {
    const t = l.chips[id];
    if (S.design === 'word') return w(t);
    if (S.design === 'icon') return ic(ICON[id]) + '<span class="tip">' + w(t) + '</span>';
    return ic(ICON[id]) + w(t);
  };
  const b = (id, cls) => '<button class="c ' + cls + '" data-chip="' + id + '" aria-label="' + l.chips[id] + '">' + inner(id) + '</button>';
  const list = chipList();
  if (S.design === 'keys') return '<div class="chips d-keys" id="chips">' + list.map(id => '<div class="key">' + b(id, 'cap') + '</div>').join('') + '</div>';
  return '<div class="chips d-' + S.design + '" id="chips">' + list.map(id => b(id, '')).join('') + '</div>';
}

function place() {
  const a = $('anchor'), c = $('chips'), st = $('stage');
  if (!a || !c) return;
  const sc = st.getBoundingClientRect().width / st.offsetWidth;
  const rects = a.getClientRects(), last = rects[rects.length - 1] || a.getBoundingClientRect();
  const o = st.getBoundingClientRect();
  const cx = (last.left + last.right) / 2 - o.left, y = last.bottom - o.top;
  const gap = 8 * S.size;
  let left = cx / sc - c.offsetWidth / 2, top = y / sc + gap;
  left = Math.max(10, Math.min(st.offsetWidth - c.offsetWidth - 10, left));
  c.style.left = left + 'px';
  c.style.top = top + 'px';
}

function fit() {
  const st = $('stage'), f = $('fit');
  const k = Math.min(f.clientWidth / st.offsetWidth, f.clientHeight / st.offsetHeight, 1.25);
  st.style.transform = 'translate(' + Math.max(0, (f.clientWidth - st.offsetWidth * k) / 2) + 'px,' + Math.max(0, (f.clientHeight - st.offsetHeight * k) / 2) + 'px) scale(' + k + ')';
  place();
}

function render() {
  vars(); bar();
  const kbH = 196 * S.size, kbW = 671 * S.size;
  const st = $('stage');
  st.dataset.style = S.theme;
  const w = Math.max(760, kbW + 40), appH = 250 + 20 * S.size, h = 14 + appH + 18 + kbH + 14;
  st.style.width = w + 'px'; st.style.height = h + 'px';
  st.innerHTML = app(appH) + keyboard() + chips();
  const d = DESIGNS[S.design];
  $('say').innerHTML = d.say + (S.tr ? ' The Translate chip opens your browser’s translate page.' : '');
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
}

document.addEventListener('click', e => {
  const o = e.target.closest('.o');
  if (o && o.id === 'again') { S.hidden = false; render(); return; }
  if (o) {
    const k = o.dataset.k, v = o.dataset.v;
    S[k] = k === 'size' ? Number(v) : k === 'tr' ? v === '1' : v;
    S.hidden = false; save(); render(); return;
  }
  const c = e.target.closest('.c');
  if (c) {
    const id = c.dataset.chip, l = L[S.lang], w = '<span class="w' + (l.ar ? ' ar' : '') + '">' + l.done[id] + '</span>';
    c.innerHTML = (S.design === 'word' ? '' : ic('check')) + (S.design === 'icon' ? '' : w);
    place();
    setTimeout(() => { const box = $('chips'); if (box) box.classList.add('go'); }, 650);
    setTimeout(() => { S.hidden = true; const box = $('chips'); if (box) box.remove(); }, 830);
  }
});
addEventListener('resize', fit);
render();
</script>

</body>
</html>
