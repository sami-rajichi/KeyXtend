name: Permission request
description: Ask the owner for permission to use, build or share KeyXtend (see LICENSE).
labels: ["permission"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      description: One or two sentences, for example "test a build" or "use it in a school".
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is asking?
      description: A person, school or organisation. Share no private details here; the owner can ask for them privately.
    validations:
      required: false
