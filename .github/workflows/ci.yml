name: CI

# Push to main, every pull request, and a weekly run to catch new advisories.
"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push cancels the superseded run, but only for pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds and tests everything with Qt (ADR-0013): the workspace, the Qt Quick tests and the stage the installer takes.
  # Each check job keeps the name the `main` ruleset requires.
  windows:
    if: github.event_name != 'schedule'
    name: check (windows-latest)
    runs-on: windows-latest
    env:
      # The Qt Quick tests' log, which the step after them shows even when they hang.
      QML_LOG: target/qmltest.txt
      # Runs kx-platform-windows' live clipboard tests (its build script's `LIVE_VAR`) on the runner's own clipboard.
      KX_LIVE_CLIPBOARD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: qt
        uses: ./.github/actions/qt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cxx-qt builds against Qt, so a new Qt starts a new cache.
          key: qt-${{ steps.qt.outputs.version }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The gate-only inputs: the adapter's `sim-input` for the real-hook test, the app's `gate-input` for its parser
      # tests and exe check and its `gate-voice` for the played clip, the worker's `gate` for its sound-file tests, and
      # kx-gates' `voice` for the G22 runs that pass the sound flag. The stage below builds without them and refuses a
      # program holding a gate flag.
      - run: cargo clippy -p kx-platform-windows --all-targets --features sim-input --locked -- -D warnings
      - run: cargo clippy -p keyxtend --all-targets --features gate-input --locked -- -D warnings
      - run: cargo clippy -p keyxtend --all-targets --features gate-voice --locked -- -D warnings
      - run: cargo clippy -p keyxtend-worker --all-targets --features gate --locked -- -D warnings
      - run: cargo clippy -p kx-gates --all-targets --features voice --locked -- -D warnings
      - run: cargo test -p kx-platform-windows --features sim-input --locked
      - run: cargo test -p keyxtend --features gate-input --locked
      - run: cargo test -p keyxtend --features gate-voice --locked
      - run: cargo test -p keyxtend-worker --features gate --locked
      - run: cargo test -p kx-gates --features voice --locked
      # The app with the scroll module's feature off, so the scroll module stays optional. The app's life test `ships`
      # checks that this list is the default features without `mod-scroll`.
      - run: >-
          cargo clippy -p keyxtend --all-targets --no-default-features
          --features mod-clipboard,mod-keyboard,mod-layouts,mod-mouse,mod-power,mod-predict,mod-selection,mod-snip,mod-vault,mod-voice
          --locked -- -D warnings
      - run: cargo xtask tidy
      # Lays out the bundled fonts and icons where the Qt Quick tests load them (target/tmp/qmltest-assets).
      - run: cargo test -p kx-ui --test texts --locked
      - name: Qt Quick tests
        # A test that hangs fails here after 20 minutes, not at the job's 6-hour limit; the suite took about 12 (P11).
        timeout-minutes: 20
        env:
          # Each QML file compiles afresh, so a stale cache never hides a change.
          QML_DISABLE_DISK_CACHE: "1"
        run: |
          # Qt's test log reaches a file, never a redirected stdout (`-o -,txt` printed nothing on the dev PC).
          qmltestrunner -input crates/kx-ui/qmltest -o "$env:QML_LOG,txt"
          $code = $LASTEXITCODE
          $log = Get-Content $env:QML_LOG
          # A skip (fonts.js: a Windows font this image lacks) shows on the pull request, so it never passes unseen.
          $log | Where-Object { $_ -like 'SKIP*' } | ForEach-Object { "::warning title=Qt Quick test skipped::$_" }
          if ($log | Where-Object { $_ -like 'QWARN*' }) { throw 'a Qt Quick test logged a warning' }
          exit $code
      # Runs even when the tests fail or hang past the timeout, so the job log shows how far they got.
      - name: Qt Quick test log
        if: always()
        run: if (Test-Path $env:QML_LOG) { Get-Content $env:QML_LOG }
      # The stage's worker carries the engine's graphics-card part, which builds with the Vulkan SDK.
      - uses: ./.github/actions/vulkan
        timeout-minutes: 15
      # Builds the app and the worker in release, stages only the files they load, then checks the stage (ADR-0012).
      - run: cargo xtask stage

  # Linux has no Qt until P15 (ADR-0016): the app is left out, kx-ui builds without its default `qt` feature, and the
  # worker without its default speech engine (ADR-0044), which Linux builds lack until P15.
  linux:
    if: github.event_name != 'schedule'
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Every workspace package sits in exactly one list; the first step fails when a package is missing or extra.
      PACKAGES: >-
        -p kx-crypto -p kx-gates -p kx-ipc -p kx-kernel -p kx-mod-clipboard -p kx-mod-keyboard
        -p kx-mod-layouts -p kx-mod-mouse -p kx-mod-power -p kx-mod-predict -p kx-mod-scroll -p kx-mod-selection
        -p kx-mod-snip -p kx-mod-vault -p kx-mod-voice -p kx-module-api -p kx-platform -p kx-platform-fake -p kx-platform-net
        -p kx-platform-record -p kx-platform-windows -p kx-settings -p kx-target-window -p kx-test-support -p kx-theme
        -p xtask
      NO_DEFAULT: -p keyxtend-worker -p kx-ui
      QT_ONLY: -p keyxtend -p kx-test-icons
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: The package lists hold every workspace package once
        run: |
          listed=$(printf '%s\n' $PACKAGES $NO_DEFAULT $QT_ONLY | grep -vx -- -p | sort)
          meta=$(cargo metadata --no-deps --format-version 1 --locked)
          names='import json, sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"]]'
          found=$(echo "$meta" | python3 -c "$names" | sort)
          diff <(echo "$listed") <(echo "$found")
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked $PACKAGES -- -D warnings
      - run: cargo clippy --all-targets --locked --no-default-features $NO_DEFAULT -- -D warnings
      - run: cargo test --locked $PACKAGES
      - run: cargo test --locked --no-default-features $NO_DEFAULT
      - run: cargo xtask tidy

  # Gate G26 (roadmap; its Japanese IME part is F16): German, Russian, Hebrew and Persian labels match their layouts
  # and their text arrives intact. It moves the runner's mouse and switches the runner's languages, never a developer's.
  g26:
    name: gate G26 (windows-latest)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # An empty `data` folder beside the app (kx-platform `PORTABLE_DIR`) makes it portable, so it reads no user folder.
      DATA: target/debug/data
      # The gates' out folder (kx-gates.toml `out`), which holds target-window's log; a kx-gates test pins both.
      GATE_LOGS: target/gate-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: qt
        uses: ./.github/actions/qt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: qt-${{ steps.qt.outputs.version }}
      - run: cargo build --locked -p keyxtend -p kx-gates -p kx-target-window
      - name: Add the G26 languages to the runner
        # The tags come from kx-gates-p3.toml `[g26] languages`; the International module ships with Windows PowerShell.
        shell: powershell
        run: |
          $found = Select-String -Path tools/kx-gates/kx-gates-p3.toml -Pattern '^languages = (\[.*\])$'
          $list = Get-WinUserLanguageList
          foreach ($tag in ($found.Matches[0].Groups[1].Value | ConvertFrom-Json)) { $list.Add($tag) }
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | Format-Table LanguageTag, InputMethodTips -AutoSize
      - name: Start KeyXtend
        run: |
          New-Item -ItemType Directory -Force $env:DATA | Out-Null
          Start-Process target/debug/keyxtend.exe
      # kx-gates exits with a failure when the gate broke off or did not pass.
      - name: G26
        run: cargo run --locked -p kx-gates -- g26 keyxtend
      - name: Close KeyXtend
        if: always()
        run: cargo run --locked -p kx-gates -- close keyxtend
      # After a failure or a timeout, the app's log (kx-settings `logs` in DATA), target-window's log and the results.
      - name: G26 logs
        if: ${{ !success() }}
        run: |
          $logs = Get-ChildItem "$env:DATA/logs/*.log", "$env:GATE_LOGS/*.log", "$env:GATE_LOGS/*.jsonl" -ErrorAction SilentlyContinue
          foreach ($f in $logs) { "== $($f.FullName)"; Get-Content -LiteralPath $f.FullName }

  # Checks licences, bans and advisories against deny.toml, and scans for known vulnerabilities.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny --locked check
      - run: cargo audit

  # Confirms every commit in the pull request carries a DCO sign-off.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - run: cargo xtask dco "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
