name: CI

# Push to main, every pull request, and a weekly run to catch new advisories.
"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A new push cancels the superseded run, but only for pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Builds and tests everything with Qt (ADR-0013): the workspace, the Qt Quick tests and the stage the installer takes.
  # Each check job keeps the name the `main` ruleset requires.
  windows:
    if: github.event_name != 'schedule'
    name: check (windows-latest)
    runs-on: windows-latest
    env:
      # The Qt Quick tests' log, which the step after them shows even when they hang.
      QML_LOG: target/qmltest.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: qt
        uses: ./.github/actions/qt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # cxx-qt builds against Qt, so a new Qt starts a new cache.
          key: qt-${{ steps.qt.outputs.version }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask tidy
      # Lays out the bundled fonts and icons where the Qt Quick tests load them (target/tmp/qmltest-assets).
      - run: cargo test -p kx-ui --test texts --locked
      - name: Qt Quick tests
        # A test that hangs fails here after 10 minutes, not at the job's 6-hour limit.
        timeout-minutes: 10
        env:
          # Each QML file compiles afresh, so a stale cache never hides a change.
          QML_DISABLE_DISK_CACHE: "1"
        run: |
          # Qt's test log reaches a file, never a redirected stdout (`-o -,txt` printed nothing on the dev PC).
          qmltestrunner -input crates/kx-ui/qmltest -o "$env:QML_LOG,txt"
          $code = $LASTEXITCODE
          $log = Get-Content $env:QML_LOG
          # A skip (fonts.js: a Windows font this image lacks) shows on the pull request, so it never passes unseen.
          $log | Where-Object { $_ -like 'SKIP*' } | ForEach-Object { "::warning title=Qt Quick test skipped::$_" }
          if ($log | Where-Object { $_ -like 'QWARN*' }) { throw 'a Qt Quick test logged a warning' }
          exit $code
      # Runs even when the tests fail or hang past the timeout, so the job log shows how far they got.
      - name: Qt Quick test log
        if: always()
        run: if (Test-Path $env:QML_LOG) { Get-Content $env:QML_LOG }
      # Builds the app in release and stages only the Qt files it loads, then checks the stage (ADR-0012).
      - run: cargo xtask stage

  # Linux has no Qt until P15 (ADR-0016): the app is left out, and kx-ui builds without its default `qt` feature.
  linux:
    if: github.event_name != 'schedule'
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # Every workspace package sits in exactly one list; the first step fails when a package is missing or extra.
      PACKAGES: >-
        -p kx-gates -p kx-kernel -p kx-mod-keyboard -p kx-mod-layouts -p kx-module-api -p kx-platform
        -p kx-platform-fake -p kx-platform-windows -p kx-settings -p kx-target-window -p kx-test-support -p kx-theme
        -p xtask
      NO_QT: -p kx-ui
      QT_ONLY: -p keyxtend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: The package lists hold every workspace package once
        run: |
          listed=$(printf '%s\n' $PACKAGES $NO_QT $QT_ONLY | grep -vx -- -p | sort)
          meta=$(cargo metadata --no-deps --format-version 1 --locked)
          names='import json, sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"]]'
          found=$(echo "$meta" | python3 -c "$names" | sort)
          diff <(echo "$listed") <(echo "$found")
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked $PACKAGES -- -D warnings
      - run: cargo clippy --all-targets --locked --no-default-features $NO_QT -- -D warnings
      - run: cargo test --locked $PACKAGES
      - run: cargo test --locked --no-default-features $NO_QT
      - run: cargo xtask tidy

  # Gate G26 (roadmap; its Japanese IME part is F16): German, Russian, Hebrew and Persian labels match their layouts
  # and their text arrives intact. It moves the runner's mouse and switches the runner's languages, never a developer's.
  g26:
    name: gate G26 (windows-latest)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # An empty `data` folder beside the app (kx-platform `PORTABLE_DIR`) makes it portable, so it reads no user folder.
      DATA: target/debug/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: qt
        uses: ./.github/actions/qt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: qt-${{ steps.qt.outputs.version }}
      - run: cargo build --locked -p keyxtend -p kx-gates -p kx-target-window
      - name: Add the G26 languages to the runner
        # The tags come from kx-gates-p3.toml `[g26] languages`; the International module ships with Windows PowerShell.
        shell: powershell
        run: |
          $found = Select-String -Path tools/kx-gates/kx-gates-p3.toml -Pattern '^languages = (\[.*\])$'
          $list = Get-WinUserLanguageList
          foreach ($tag in ($found.Matches[0].Groups[1].Value | ConvertFrom-Json)) { $list.Add($tag) }
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | Format-Table LanguageTag, InputMethodTips -AutoSize
      - name: Start KeyXtend
        run: |
          New-Item -ItemType Directory -Force $env:DATA | Out-Null
          Start-Process target/debug/keyxtend.exe
      # kx-gates exits with a failure when the gate broke off or did not pass.
      - name: G26
        run: cargo run --locked -p kx-gates -- g26 keyxtend
      - name: Close KeyXtend
        if: always()
        run: cargo run --locked -p kx-gates -- close keyxtend

  # Checks licences, bans and advisories against deny.toml, and scans for known vulnerabilities.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny --locked check
      - run: cargo audit

  # Confirms every commit in the pull request carries a DCO sign-off.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - run: cargo xtask dco "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
