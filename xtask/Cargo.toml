[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The sound tokens' format check and the RIFF chunk walker, which the app's build shares; `files` turns on the readers.
kx-theme = { path = "../crates/kx-theme", features = ["files"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# `cargo xtask words`, at build time only: bzip2 dumps (Task 8b), wordfreq's gzipped msgpack lists, Hunspell
# dictionaries, SHA-256 source checks, and the word-pack writer.
bzip2 = "0.6.1"
flate2 = "1.1.10"
kx-mod-predict = { path = "../crates/kx-mod-predict", features = ["build"] }
rmpv = "1.3.1"
sha2 = "0.11.1"
spellbook = "0.4.2"

[dev-dependencies]
proptest = { workspace = true }
