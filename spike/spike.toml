# Every value the spike's later-phase parts and kx-gates use; read beside the exe, else from spike/.
# The keyboard's sections moved to the product in P3 (docs/spike-move-map.md); the frozen staged face keeps its copy.

[keyboard]
# Window title, so kx-gates can find the face.
title = "KeyXtend spike - Qt"

# The cap on G1's desktop screenshot and G6's pictures; the tools row and the snip left in P12.
[shot]
# Largest screen copy made, in MiB; three 4K screens need about 100.
cap_mb = 256

# The Arabic test panel for gate G7 (mock-up .pop): a right-to-left stand-in for Settings, opened by the Settings key.
# Rows per page (ADR-0008), the page text with {n} and {count}, the field's screen-reader name, and each button's icon and name.
[panel]
title = "الإعدادات"
icon = "settings-2"
items = ["المظهر", "حجم لوحة المفاتيح", "اللغات والتخطيطات", "الكتابة الصوتية", "اقتراح الكلمات", "الحافظة", "التَّشْكِيل"]
rows = 5
page = "{n} من {count}"
field = "حقل النص"
hint = "اكتب هنا"
close = { icon = "x", name = "إغلاق" }
prev = { icon = "chevron-up", name = "الصفحة السابقة" }
next = { icon = "chevron-down", name = "الصفحة التالية" }
