# Every number and path the P1 spike uses. Staged next to each exe; else read from spike/.

[keyboard]
# Window titles, so the harness can find each face.
titles = { slint = "KeyXtend spike - Slint", qt = "KeyXtend spike - Qt", tauri = "KeyXtend spike - Tauri" }
# One key unit in logical pixels, and the gap between keys.
key_px = 48.0
gap_px = 4.0
# Label font size in logical pixels.
font_px = 16.0
# Wait after the window appears before guarding it and handing focus back, and between retries, in ms.
guard_delay_ms = 300
# Guard tries while no window of ours is visible yet; focus is handed back even when they run out.
guard_tries = 10
# How often labels follow the layout of the app in front, in ms.
relabel_ms = 500
# The 5-row block as scan codes; 0xE0xx marks an extended key.
rows = [
    [0x29, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E],
    [0x0F, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A, 0x1B, 0x2B],
    [0x3A, 0x1E, 0x1F, 0x20, 0x21, 0x22, 0x23, 0x24, 0x25, 0x26, 0x27, 0x28, 0x1C],
    [0x2A, 0x56, 0x2C, 0x2D, 0x2E, 0x2F, 0x30, 0x31, 0x32, 0x33, 0x34, 0x35, 0x36],
    [0x1D, 0xE05B, 0x38, 0x39, 0xE038, 0xE01D],
]
# Key widths in key units; keys not listed are 1.0.
widths = [
    [0x0E, 2.0], [0x0F, 1.5], [0x2B, 1.5], [0x3A, 1.75], [0x1C, 2.25],
    [0x2A, 1.25], [0x36, 2.75], [0x1D, 1.5], [0xE05B, 1.25], [0x38, 1.25],
    [0x39, 6.25], [0xE038, 1.25], [0xE01D, 1.5],
]

# The stage-2 keyboard from design/keyboard-style-lab.html (lines 145-168, 241-242, 927-1006), in logical pixels at size 1.
[layout]
# One key unit wide, and one row high.
unit_px = 33.0
row_px = 31.0
# The main block is this many units wide; a key w units wide spans w * columns_per_unit grid columns.
main_units = 16.0
columns_per_unit = 4
# Side block: this many columns, each side_unit units wide.
side_columns = 3
side_unit = 1.22
# Gap between the main and side blocks; plate padding (top, right, bottom, left); top bar height and the gap under it.
body_gap_px = 8.0
plate_pad_px = [6.0, 7.0, 7.0, 7.0]
top_bar_px = 24.0
top_gap_px = 4.0
# D-pad cells as first col, first row, last col, last row (1-based, inclusive); it is min(dpad_units units, its rows) wide, less one gap.
dpad_cell = [1, 2, 2, 4]
dpad_units = 2.44
# Main rows: named keys with their width in units, kind and scan code (0xE0xx is extended), and runs of 1-unit character keys.
rows = [
    [{ id = "esc", w = 1.0, kind = "danger", sc = 0x01 }, { chars = [0x29, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D] }, { id = "bksp", w = 2.0, kind = "danger", sc = 0x0E }],
    [{ id = "tab", w = 1.5, kind = "mod", sc = 0x0F }, { chars = [0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A, 0x1B, 0x2B] }, { id = "del", w = 1.5, kind = "mod", sc = 0xE053 }],
    [{ id = "caps", w = 1.75, kind = "mod", sc = 0x3A }, { chars = [0x1E, 0x1F, 0x20, 0x21, 0x22, 0x23, 0x24, 0x25, 0x26, 0x27, 0x28] }, { id = "enter", w = 3.25, kind = "enter", sc = 0x1C }],
    [{ id = "shift", w = 2.25, kind = "mod", sc = 0x2A }, { chars = [0x2C, 0x2D, 0x2E, 0x2F, 0x30, 0x31, 0x32, 0x33, 0x34, 0x35] }, { id = "rshift", w = 1.75, kind = "mod", sc = 0x36 }, { id = "up", w = 1.0, kind = "mod", sc = 0xE048 }, { id = "menu", w = 1.0, kind = "mod", sc = 0xE05D }],
    [{ id = "ctrl", w = 1.25, kind = "mod", sc = 0x1D }, { id = "win", w = 1.0, kind = "mod", sc = 0xE05B }, { id = "alt", w = 1.0, kind = "mod", sc = 0x38 }, { id = "lang", w = 1.75, kind = "lang" }, { id = "space", w = 7.0, kind = "space", sc = 0x39 }, { id = "altgr", w = 1.0, kind = "mod", sc = 0xE038 }, { id = "left", w = 1.0, kind = "mod", sc = 0xE04B }, { id = "down", w = 1.0, kind = "mod", sc = 0xE050 }, { id = "right", w = 1.0, kind = "mod", sc = 0xE04D }],
]
# Side keys by column and row (1-based).
side = [
    { id = "rclick", col = 1, row = 1 }, { id = "grab", col = 2, row = 1 }, { id = "shortcuts", col = 3, row = 1 },
    { id = "mic", col = 3, row = 2 }, { id = "clip", col = 3, row = 3 }, { id = "snip", col = 3, row = 4 },
    { id = "fill", col = 1, row = 5 }, { id = "settings", col = 2, row = 5 }, { id = "power", col = 3, row = 5 },
]

# The keyboard's look (spec 3.5): the starting theme (an id in themes.toml) and mode: "light", "dark" or "auto" to follow Windows.
[look]
theme = "native"
mode = "auto"
# A legend keeps this contrast when its key takes the Windows accent; spec 3.5 asks for 4.5:1.
min_contrast = 4.5
# Native's frosted plate: "none", "mica" or "acrylic" (DWM backdrops) or "blur" (accent-policy blur); the plate keeps this share of its colour.
backdrop = "acrylic"
plate_alpha = 0.88
# Turns every animation off except the hold ring.
reduced_motion = false
# Themes whose Enter, on and lock colours follow the Windows accent colour, for example ["native"]; empty keeps each theme's own.
accent_themes = []
# Hover time before an icon button's name shows in a tooltip (Windows' default tooltip delay).
tip_ms = 500

# Keyboard size (spec 3.1): presets S, M and L, the step of the - and + buttons, and the limits; the keyboard starts at S.
[size]
presets = [1.0, 1.25, 1.5]
step = 0.05
min = 0.8
max = 1.8
# While the keyboard is being moved or resized, the pointer is read this often (ms), about once a frame.
poll_ms = 16

[target]
# Title of the recording window.
title = "KeyXtend spike - target"
# Log of every character it receives, relative to the spike folder.
log = "../target/spike-logs/target-window.log"
# Text font and its height in pixels; Segoe UI covers Latin and Arabic.
font = "Segoe UI"
font_px = 24
# Window size in pixels.
width_px = 900
height_px = 500
# Switch that makes the box a single-line password box, where typed characters are never logged.
password_arg = "--password"

# Stage 1b: the tools row under the keys, the selection pill, quick-fill and snip.
[tools]
labels = { fill_user = "Fill user", fill_password = "Fill password", snip = "Snip", mic = "Mic", copy = "Copy" }
# Window titles, so the harness can find them.
pill_title = "KeyXtend spike - pill"
overlay_title = "KeyXtend spike - snip"
# How often the selection watcher looks at the focused text, in ms.
selection_poll_ms = 300
# Pill width, height and gap from the selected text, in logical pixels.
pill_px = [72.0, 32.0, 8.0]
# The pill's Copy button presses Ctrl+C (virtual keys).
copy_keys = [0x11, 0x43]
# Windows Hello prompt; Fill types only after Hello says yes.
hello_message = "KeyXtend spike: type the test value?"
# Fake values only; never a real name or password.
test_user = "kx-test-user"
test_password = "kx-test-pass-42"
# Wait after giving the app in front its focus back, before typing, in ms.
fill_settle_ms = 300
# Folder under TEMP for snips and the frozen screen; the harness deletes what it reads.
snip_folder = "kx-spike-snips"
# Largest screen copy made or read, in MiB; three 4K screens need about 100.
shot_cap_mb = 256
# Width of the snip region's two-tone edge, in logical pixels.
snip_edge_px = 2.0
# What the snip overlay tells a screen reader.
snip_hint = "Snip: click two corners of the region. Click the same spot twice to cancel."

# Stage 1b part C: voice. Only the worker opens the mic; the face shows a caption bar.
[voice]
# The worker program, staged next to each face.
worker = "worker.exe"
# Worker switches: run the local server in weak mode; allow the cloud engine.
weak_arg = "--weak"
cloud_arg = "--cloud"
# Engine for the Mic button: "local" or "cloud". Cloud also needs cloud_on and a key.
engine = "local"
# Nothing goes to the cloud unless this is true.
cloud_on = false
# Longest recording, in seconds, and the sample rate both engines take, in Hz.
record_max_s = 30
rate_hz = 16000
# Primary language of the keyboard layout in front (low 10 bits of its LANGID) to the spoken language; covers regional layouts.
languages = { "09" = "en", "0C" = "fr", "01" = "ar" }
# Language for any other layout; "auto" lets the engine detect it.
default_lang = "auto"
# Typed after each transcript, so sentences do not run together.
type_suffix = " "
# Gap between typed characters, in ms: Notepad kept 10 ms exact but dropped most of a one-batch sentence (G22 typing check).
type_gap_ms = 10
# Face and worker switch, followed by a folder: keep each clip there for the bench.
keep_arg = "--keep"
# Longest JSON line between face and worker, in bytes; a 30 s transcript is far shorter.
line_max_bytes = 16384

# whisper.cpp's server, started once with the worker so the model loads once.
[voice.local]
server = "D:/dev/whisper/b5130/whisper-server.exe"
model = "D:/dev/models/ggml-base.bin"
host = "127.0.0.1"
port = 8178
threads = 4
path = "/inference"
# Answers 200 once the model is loaded.
health_path = "/health"
# Longest wait for the server to answer after start, the pause between checks, and the longest wait per clip, in ms.
ready_wait_ms = 30000
ready_poll_ms = 250
timeout_ms = 60000

# The opt-in cloud engine; the key is read from the environment, never from a file.
[voice.cloud]
host = "api.groq.com"
path = "/openai/v1/audio/transcriptions"
model = "whisper-large-v3"
key_env = "GROQ_API_KEY"
timeout_ms = 30000

# Weak mode: the local server's job is capped to these cores, CPU share (percent) and memory (MiB).
[voice.weak]
cores = 2
rate_pct = 30
mem_mb = 4096

# The caption bar at the bottom centre; it never takes focus.
[voice.caption]
title = "KeyXtend spike - caption"
# Width, height and gap from the bottom of the work area, in logical pixels.
px = [720.0, 56.0, 24.0]
listening = "Listening…"
transcribing = "Transcribing…"
nothing_heard = "Nothing heard."
# How long the text stays after it arrives, in ms.
hide_ms = 4000

# How each named key looks (spec 3.1, mock-up keyInner): a Lucide icon or a text label, and the name that
# screen readers say and icon tooltips show. `latch` makes a sticky modifier; side keys say what they do.
[keys]
esc = { label = "Esc", name = "Escape" }
bksp = { icon = "delete", name = "Backspace" }
tab = { icon = "arrow-right-to-line", name = "Tab" }
del = { label = "Del", name = "Delete" }
caps = { label = "Caps", name = "Caps Lock", caps = true }
enter = { icon = "corner-down-left", name = "Enter" }
shift = { icon = "arrow-big-up", name = "Shift", latch = "shift" }
rshift = { icon = "arrow-big-up", name = "Shift", latch = "shift" }
up = { icon = "chevron-up", name = "Up" }
menu = { icon = "square-menu", name = "Menu key (context menu)" }
ctrl = { label = "Ctrl", name = "Control", latch = "ctrl" }
win = { icon = "win-logo", name = "Windows key", latch = "win" }
alt = { label = "Alt", name = "Alt", latch = "alt" }
lang = { name = "Language" }
space = { name = "Space" }
altgr = { label = "AltGr", name = "AltGr", latch = "altgr" }
left = { icon = "chevron-left", name = "Left" }
down = { icon = "chevron-down", name = "Down" }
right = { icon = "chevron-right", name = "Right" }
rclick = { icon = "mouse-right", name = "Right-click by holding", action = "toggle" }
grab = { icon = "hand-grab", name = "Grab: drag and drop, select text", action = "toggle" }
shortcuts = { icon = "command", name = "Shortcuts", action = "toggle" }
mic = { icon = "mic", name = "Voice typing", action = "mic" }
clip = { icon = "clipboard-clock", name = "Clipboard history", action = "toggle" }
snip = { icon = "scissors-line-dashed", name = "Snip", action = "snip" }
fill = { icon = "key-round", name = "Quick-fill", action = "fill" }
settings = { icon = "settings-2", name = "Settings", action = "note", note = "Settings get their own window in a later phase." }
power = { icon = "power", name = "Power", action = "note", note = "Power opens the Windows shut-down dialog in the real app; the spike does nothing." }

# The top bar (mock-up topBar) plus the owner's size buttons and resize corner; icon_on shows while a switch is on.
# Size uses lenses, since the Windows sign for minimise is the plain minus.
[bar]
grip = { icon = "grip-horizontal", name = "Move keyboard: click, move, click" }
theme = { icon = "moon", icon_on = "sun", name = "Light or soft dark" }
smaller = { icon = "zoom-out", name = "Smaller" }
bigger = { icon = "zoom-in", name = "Bigger" }
minimise = { icon = "minus", name = "Minimise to a bubble" }
bubble = { icon = "keyboard", name = "Show the keyboard" }
bubble_title = "KeyXtend spike - bubble"
# The bubble always goes to this bottom corner of the keyboard's screen, above the taskbar: "right" or "left".
bubble_corner = "right"
catch_name = "Click to finish moving or resizing"
close = { icon = "x", name = "Close" }
corner = { icon = "move-diagonal-2", name = "Resize: click, move, click" }
# The D-pad's arrows (up, right, left, down) and its Stop button.
dpad = [
    { icon = "chevron-up", name = "Scroll up" }, { icon = "chevron-right", name = "Scroll right" },
    { icon = "chevron-left", name = "Scroll left" }, { icon = "chevron-down", name = "Scroll down" },
    { icon = "square", name = "Stop scrolling" },
]
# One label and one spoken name per size preset.
sizes = ["S", "M", "L"]
size_names = ["Small", "Medium", "Large"]
# The test strip under the keyboard: light, dark and auto buttons, and sample chips that type their text.
modes = ["Light", "Dark", "Auto"]
chips = [{ text = "Hello" }, { text = "Thanks" }, { text = "شكرًا" }, { text = "@gmail.com", icon = "at-sign" }]

# Fonts and icons, under the settings folder; stage-lib.ps1 copies them from the D:\dev assets folder.
[assets]
fonts = "assets/fonts"
icons = "assets/icons"
icon_ext = "svg"
# Font files the faces load, by extension.
font_exts = ["ttf", "otf"]

# The language key shows the ISO code in capitals unless a short name is set here; the space bar joins language and layout.
[lang]
short = { ar = "ع" }
joiner = " · "
