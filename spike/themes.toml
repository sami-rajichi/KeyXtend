[[theme]]
id = "dolch"
name = "Modern Dolch"
key_radius_px = 5.0
window_radius_px = 10.0
gap_px = 3.0
legend_px = 13.0
mod_legend_px = 10.5
legend_weight = 500
arabic_scale = 1.1
