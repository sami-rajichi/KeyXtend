# The three keyboard themes, each light and soft dark, from design/keyboard-style-lab.html (lines 105-142, 198-217); CSS rgba() is #RRGGBBAA.
# The faces take every colour and each theme's radius, gap and fonts from here; shared sizes are in shape.toml, timings in motion.toml.

# Colours every theme shares, written once in the mock-up: the press shade (.key.down brightness .94), the caption's
# recording dot (.rec-dot), the Copy pill's hover (.selpill button:hover) and the snip overlay (.snip-dim, .snip-rect, .dims).
[common]
press = "#0000000F"
rec_dot = "#E5484D"
pill_hover = "#7F7F7F38"
snip_dim = "#0000006B"
snip_edge = "#FFFFFF"
snip_tag = "#00000099"

[[theme]]
id = "native"
name = "Native Adaptive"
key_radius_px = 4.0
window_radius_px = 8.0
gap_px = 4.0
legend_px = 13.0
mod_legend_px = 11.0
legend_weight = 400
arabic_scale = 1.12
latin_fonts = ["Segoe UI Variable Text", "Segoe UI", "Noto Sans"]
arabic_fonts = ["Segoe UI", "Noto Sans Arabic"]
led_glow_px = 5.0
lock_glow_px = 0.0
lock_glow_mix = 0.0

[theme.cap]
kind = "flat"

# The D-pad's colours, as token names (mock-up lines 241-257).
[theme.dpad]
face = "key_act"
ink = "legend_act"
on = "on"
on_ink = "on_ink"
stop = "rec"
stop_ink = "rec_ink"

[theme.light]
# The mock-up's 88% #F3F3F3 frosted plate as it shows over its wallpaper.
