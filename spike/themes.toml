# A convex cap: lighter at the top, darker at the bottom; pressed, the gradient flips.
[theme.cap]
kind = "convex"
rest = { lighten = 0.07, mid_stop = 0.55, darken = 0.07, upward = false }
pressed = { lighten = 0.05, mid_stop = 0.50, darken = 0.08, upward = true }

# The D-pad's colours, as token names: ET66 lights its arrow and Stop in the Enter yellow (mock-up lines 253 and 257).
[theme.dpad]
face = "key_act"
ink = "legend_act"
on = "enter"
on_ink = "enter_ink"
stop = "enter"
stop_ink = "enter_ink"

