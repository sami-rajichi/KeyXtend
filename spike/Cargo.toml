# P1 spike workspace: kept and moved into the product phase by phase (ADR-0014, docs/spike-move-map.md).
# The face qt-kb no longer builds (ADR-0016); its files stay as source until they move.
[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
] }
