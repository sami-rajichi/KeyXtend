# P1 spike workspace: kept and moved into the product phase by phase (ADR-0014, docs/spike-move-map.md).
# Each face (slint-kb, qt-kb, tauri-kb) is its own workspace, so they build in parallel.
[workspace]
members = ["core", "target-window", "harness", "worker"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
spike-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
embed-manifest = "1.5"
# WinRT async results (Windows Hello); already pulled in by `windows`, same licence.
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
