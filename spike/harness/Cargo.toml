[package]
name = "harness"
description = "P1 spike: drives gates G1-G6 and G17-G25 and prints the numbers."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
spike-core.workspace = true
kx-test-support = { path = "../../crates/kx-test-support" }
kx-target-window = { path = "../../tools/kx-target-window" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Features the harness code uses itself.
windows = { workspace = true, features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
] }

[build-dependencies]
embed-manifest.workspace = true
