[package]
name = "spike-core"
description = "P1 spike core: injection, window guard, layouts, hold engine, UI Automation, pill, Hello fill, snip and the face side of voice."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# `KeyChars` and `Slot` moved here in P3 (ADR-0014).
kx-module-api = { path = "../../crates/kx-module-api" }
# The UI port types (system look, backdrop kinds, errors) the moved window and look parts use (P3).
kx-platform = { path = "../../crates/kx-platform" }
# COM, folders, uiAccess, input, layouts, the window guard, screens, the system look and backdrops moved here in P3 (ADR-0014).
kx-platform-windows = { path = "../../crates/kx-platform-windows" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
windows-future.workspace = true
# UI Automation for the pill and probes, Windows Hello for quick-fill and job objects for the voice server.
windows = { workspace = true, features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
] }
