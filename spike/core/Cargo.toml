[package]
name = "spike-core"
description = "P1 spike core: pill, snip, voice and the gates' face facts."
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
# The clock, the input and layout ports and the screen boxes moved here in P2 and P3 (ADR-0014).
kx-module-api = { path = "../../crates/kx-module-api" }
# The board's boxes (`Area`), the placement maths and the Arabic test moved here in P3 (ADR-0014).
kx-mod-keyboard = { path = "../../crates/kx-mod-keyboard" }
# The UI port errors the screen spots use (P3).
kx-platform = { path = "../../crates/kx-platform" }
# COM, folders, input, layouts, the window guard and screens moved here in P3, and the UI Automation client in P7
# (ADR-0014).
kx-platform-windows = { path = "../../crates/kx-platform-windows" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Job objects for the voice server.
windows = { workspace = true, features = ["Win32_System_JobObjects"] }
