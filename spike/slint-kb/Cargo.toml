# P1 spike: the Slint face of the stage-1 keyboard. Throwaway, deleted at the end of P1.
[package]
name = "slint-kb"
description = "P1 spike: the stage-1 keyboard drawn with Slint."
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Its own workspace, so it builds apart from the other faces.
[workspace]

[dependencies]
# The winit hook opens every window without taking focus; Slint has no stable way to do this.
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
spike-core = { path = "../core" }

[build-dependencies]
slint-build = "=1.18.1"
embed-manifest = "1.5"
