# Sizes all three themes share, from the mock-up's CSS (design/keyboard-style-lab.html), in pixels at size 1 unless a section says
# otherwise.
# Lists follow the order their comment gives.
[bar]
# Top-bar buttons: width and height, icon, S/M/L text and its weight while lit, radius as a share of the key radius, gap.
button_px = [24.0, 22.0]
icon_px = 14.0
label_px = 11.0
lit_weight = 600
radius_share = 0.8
gap_px = 4.0

[chip]
# Suggestion chips: height, side padding, text size (Latin, Arabic), weight, icon size, icon gap.
height_px = 20.0
pad_px = 9.0
font_px = [11.5, 12.5]
weight = 500
icon_px = 11.0
gap_px = 4.0

[legend]
# Corner legends: sizes as shares of the main one (second, third), distance (top or bottom, side), weight.
corner_scale = [0.62, 0.6]
corner_px = [2.0, 4.0]
corner_weight = 400
# Icons (main keys, side keys) and the gap to a text beside them.
icon_px = [14.0, 15.0]
gap_px = 4.0
# Space bar text size (Latin, Arabic) and side padding.
space_px = [10.5, 11.5]
space_pad_px = 6.0

[led]
# The LED dot: diameter, and distance from the cap's top and right edges.
size_px = 4.0
inset_px = 3.0

[lang]
# Language carousel: gap, side names (size, opacity), current name (Latin size, Arabic size), weight;
# a click on the left third goes back a layout.
gap_px = 5.0
side = [9.0, 0.45]
font_px = [12.5, 14.0]
weight = 600
back_share = 0.3333

[dpad]
# D-pad: gap between arrows, arrow icon, icon padding, hub and Stop insets (shares of the pad), Stop icon, grid turn.
gap_px = 2.0
icon_px = 15.0
icon_pad = 0.22
hub = 0.34
stop = 0.36
stop_icon_px = 10.0
turn_deg = 45.0

[press]
# A pressed cap sinks and shrinks (the theme's `press` colour darkens it); the ring while moving or resizing.
sink_px = 1.0
scale = 0.97
ring_px = 2.0

[tip]
# Tooltips with a button's name (WinUI ToolTip: 12 px text, 9/6 px padding): text size and weight,
# padding (top and bottom, sides), radius, and gap to the button.
font_px = 12.0
weight = 400
pad_px = [6.0, 9.0]
radius_px = 4.0
gap_px = 6.0

[line]
# Hairlines in pop_line (mock-up 1px borders): panel and tooltip edges, the corner's rim, dividers; not scaled.
px = 1.0

[pill]
# The Copy pill (mock-up .selpill): padding, button side padding, text size and weight, icon size and icon-to-text gap;
# its height is tools.pill_px.
pad_px = 3.0
button_side_px = 11.0
font_px = 12.0
weight = 600
icon_px = 13.0
gap_px = 5.0

[caption]
# The caption bar (mock-up .capbar): status padding (top and bottom, left, right), padding around words (.done),
# dot-to-status gap (.st), status text size and weight, words size (Latin, Arabic), recording dot, icon size (.i),
# status bar height (6 + the 26 px wave + 6), radius around words (.done).
pad_px = [6.0, 14.0, 8.0]
words_pad_px = 10.0
gap_px = 6.0
status_px = 12.5
status_weight = 600
words_px = [14.0, 15.0]
dot_px = 8.0
icon_px = 15.0
bar_px = 38.0
words_radius_px = 14.0
# The shimmer while the words are on their way (.shimmer): height and radius, and how many bar widths its band spans.
shimmer_px = [10.0, 6.0]
shimmer_span = 2.0

[snip]
# The snip overlay (mock-up .snip-rect .dims, .snip-bar, .hintx): size tag text size, weight, padding, radius and
# gap above the region; hint bar gap from the top, padding (3 around 28 px buttons, here text only), radius, text size.
tag_px = 11.0
tag_weight = 500
tag_pad_px = [2.0, 6.0]
tag_radius_px = 4.0
tag_gap_px = 22.0
bar_top_px = 10.0
bar_pad_px = [8.0, 9.0]
bar_radius_px = 9.0
hint_px = 11.0

[panel]
# The Arabic test panel (mock-up .pop, .clip width): width, radius share of the window radius, header padding (top, end,
# bottom, start) and gap, title size and weight, icon buttons (.ib: side, radius, icon, also the header's icon), list padding
# (top, sides, bottom), list-to-pager gap.
width_px = 480.0
radius_share = 0.9
head_pad_px = [7.0, 8.0, 7.0, 12.0]
head_gap_px = 8.0
title_px = 13.0
title_weight = 600
button_px = [28.0, 6.0, 15.0]
body_pad_px = [4.0, 8.0, 8.0]
body_gap_px = 6.0
# Rows (.lrow: height, gap, side padding, radius) and their text (Latin, Arabic); page buttons (.pg: width, height, radius, icon),
# pager gap, a page button's opacity when it cannot be used, page number (.pgn) size and weight, footer padding (.lfoot).
row_px = [46.0, 2.0, 8.0, 8.0]
row_text_px = [12.5, 14.0]
page_px = [38.0, 46.0, 9.0, 18.0]
pager_gap_px = 4.0
off_share = 0.35
count_px = 11.0
count_weight = 600
foot_pad_px = [7.0, 12.0]
# The text field is not in the mock-up: height, radius (.btn), side padding, text size (.field). The panel sits gap_px[0] above
# the keyboard, or below it when there is no room, and at least gap_px[1] inside the screen (placePop).
field_px = [34.0, 7.0, 10.0, 14.5]
gap_px = [10.0, 8.0]

[ring]
# The hold ring around the pointer (mock-up .ring, .burst), not scaled with the keyboard: side of the ring and its window,
# wave borders (first, second), the core's share of the side, burst ring (side, border), burst dots (side, count), and how far
# from the centre the dots start and end.
box_px = 76.0
wave_px = [2.5, 1.5]
core_share = 0.1
burst_px = [60.0, 2.0]
dot_px = 6.0
dots = 6
fly_px = [6.0, 30.0]

[extra]
# The resize corner (diameter, icon; not in the mock-up), the bubble (diameter, icon, inset from the screen corner; mock-up .kb-bubble),
# and the test strip (height, gap above, padding, text size).
corner_px = [20.0, 12.0]
bubble_px = [46.0, 20.0, 12.0]
strip_px = [28.0, 6.0, 8.0, 12.0]
