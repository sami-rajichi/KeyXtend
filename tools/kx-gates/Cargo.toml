[package]
name = "kx-gates"
description = "Test tool: the Windows gate runner that drives real apps and prints each gate's numbers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# `voice` adds the gates that name kx-ipc's `SOUND_FLAG` (`g22 keyxtend`, `g22 bench`). It is off by default, so the
# release kx-gates that `cargo xtask dev-install` signs holds no gate flag.
[features]
default = []
voice = ["dep:kx-ipc"]

[dependencies]
kx-test-support = { path = "../../crates/kx-test-support" }
kx-target-window = { path = "../../tools/kx-target-window" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Windows-only gates. spike-core is the Qt test face's shared code, until each phase aims its gates at the product.
[target.'cfg(windows)'.dependencies]
# The sound flag the gate worker and the voice gate build take, written once in kx-ipc; only `voice` turns it on.
kx-ipc = { path = "../../crates/kx-ipc", optional = true }
kx-module-api = { path = "../../crates/kx-module-api" }
# The sealed shelf's file names (`KEY_FILE`, `SEALED_EXT`), which G22's cloud line copies a sealed key by; it never
# opens one, and names no key guard.
kx-crypto = { path = "../../crates/kx-crypto" }
# G8's bus publish time on the product's own event bus.
kx-kernel = { path = "../../crates/kx-kernel" }
# The product's board (key ids, roles), its legend naming rule (`legend`) and the boxes (`Area`) the spike's tools-row maths returns.
kx-mod-keyboard = { path = "../../crates/kx-mod-keyboard" }
# The scan list the product reads labels for, which `capture-layouts` follows.
kx-mod-layouts = { path = "../../crates/kx-mod-layouts" }
# The mouse settings (`SPEC`) the gates read from the product's test build.
kx-mod-mouse = { path = "../../crates/kx-mod-mouse" }
# The scroll settings (`SPEC`) and stats line G6 reads from the product's test build.
kx-mod-scroll = { path = "../../crates/kx-mod-scroll" }
# Word prediction's settings, folding and scripts: G27's expected text takes the gap the word's script takes.
kx-mod-predict = { path = "../../crates/kx-mod-predict" }
# The clipboard history's settings and its insert join: G20's expected Notepad text and the copy's settings.
kx-mod-clipboard = { path = "../../crates/kx-mod-clipboard" }
# Quick-fill's tab gap range (`settings::TAB_GAP_MS`), which G23's late pause must outlast.
kx-mod-vault = { path = "../../crates/kx-mod-vault" }
# The selection chips' settings and translate sites: G19's caret wait, its long Arabic line and the link it reads.
kx-mod-selection = { path = "../../crates/kx-mod-selection" }
# Voice typing's models table, [voice] defaults and scorer: G22's bench takes each language's default and its ask.
kx-mod-voice = { path = "../../crates/kx-mod-voice" }
# The product's commands: `close` posts Quit to the running copy; the speech host G22's bench drives.
kx-platform = { path = "../../crates/kx-platform" }
# The golden layout table format that `capture-layouts` writes, and the fake speech G22's bench tests drive.
kx-platform-fake = { path = "../../crates/kx-platform-fake" }
kx-platform-windows = { path = "../../crates/kx-platform-windows" }
# The product's file names: G8 reads its log, and the gates its keyboard settings.
kx-settings = { path = "../../crates/kx-settings" }
# The language key's back part, which G25 clicks past; a test checks G8 and G9's top-bar ids against its icons.
kx-theme = { path = "../../crates/kx-theme" }
spike-core = { path = "../../spike/core" }
windows = { workspace = true, features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Property tests for the parsers of what the browser shows.
proptest.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The sound flag the exe test looks for in the built kx-gates.
kx-ipc = { path = "../../crates/kx-ipc" }

[build-dependencies]
embed-manifest.workspace = true
