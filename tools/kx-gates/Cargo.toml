[package]
name = "kx-gates"
description = "Test tool: the Windows gate runner that drives real apps and prints each gate's numbers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kx-test-support = { path = "../../crates/kx-test-support" }
kx-target-window = { path = "../../tools/kx-target-window" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Windows-only gates. spike-core is the Qt test face's shared code, until each phase aims its gates at the product.
[target.'cfg(windows)'.dependencies]
kx-module-api = { path = "../../crates/kx-module-api" }
# G8's bus publish time on the product's own event bus.
kx-kernel = { path = "../../crates/kx-kernel" }
# The product's board (key ids, roles), its legend naming rule (`legend`) and the boxes (`Area`) the spike's tools-row maths returns.
kx-mod-keyboard = { path = "../../crates/kx-mod-keyboard" }
# The scan list the product reads labels for, which `capture-layouts` follows.
kx-mod-layouts = { path = "../../crates/kx-mod-layouts" }
# The mouse settings (`SPEC`) the gates read from the product's test build.
kx-mod-mouse = { path = "../../crates/kx-mod-mouse" }
# The product's commands: `close` posts Quit to the running copy.
kx-platform = { path = "../../crates/kx-platform" }
# The golden layout table format that `capture-layouts` writes.
kx-platform-fake = { path = "../../crates/kx-platform-fake" }
kx-platform-windows = { path = "../../crates/kx-platform-windows" }
# The product's file names: G8 reads its log, and the gates its keyboard settings.
kx-settings = { path = "../../crates/kx-settings" }
# The language key's back part, which G25 clicks past; a test checks G8 and G9's top-bar ids against its icons.
kx-theme = { path = "../../crates/kx-theme" }
spike-core = { path = "../../spike/core" }
windows = { workspace = true, features = [
    "ApplicationModel_DataTransfer",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest.workspace = true
