# Every value the test window uses. Read beside the exe first, else from this folder; relative paths start here.

# Title of the recording window.
title = "KeyXtend target window"
# Log of every character it receives.
log = "../../target/gate-logs/target-window.log"
# Text font and its height in pixels; Segoe UI covers Latin and Arabic.
font = "Segoe UI"
font_px = 24
# The text box's accessible name, which Narrator and NVDA read.
edit_name = "Test text"
# Window size in pixels.
width_px = 900
height_px = 500
# Switch that makes the box a single-line password box, where typed characters are never logged.
password_arg = "--password"
# Switch, followed by an installed layout id such as 0x00000000040C040C, that switches the whole session to it.
# The window puts the previous layout back at close only while it holds the keyboard (ARCHITECTURE.md has the rest).
layout_arg = "--layout"
# Longest a gate's hang message (G5's hung target) makes the window sleep, in ms; it must stay below Windows' 5 s
# hung-window mark (checked), so Windows never swaps in its ghost window.
hang_max_ms = 3000
# Switch that fills the box with fill_lines numbered lines of fill_cols characters, unwrapped, so it scrolls both ways
# (G6, G8, G9, G10); the fill is never logged, and it stays short enough to type in (checked).
fill_arg = "--fill"
fill_lines = 100
fill_cols = 120
# Switch that makes the window DPI-unaware, as an old app is, so Windows scales it and the points it gets (G6's record).
unaware_arg = "--dpi-unaware"
