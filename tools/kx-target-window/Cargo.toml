[package]
name = "kx-target-window"
description = "Test tool: a window that logs every character it receives, with a timestamp."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# The window is Windows-only. Its QPC clock stays the spike's until P3 brings the product clock.
[target.'cfg(windows)'.dependencies]
spike-core = { path = "../../spike/core" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest.workspace = true
