[package]
name = "kx-test-icons"
description = "Test tool: the Qt Quick tests' QML plugin, which serves the bundled icons in their tint as the app does."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# Qt loads the plugin as a DLL; the Rust library lets kx-ui's tests build it as a dev-dependency.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cxx-qt-build.workspace = true
# The provider's name, the icons' folder and their file type, as the app uses them.
kx-theme = { path = "../../crates/kx-theme" }
