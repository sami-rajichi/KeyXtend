# Sound recipes for `cargo xtask sounds render`, the variants' jitter and the importer's resampler; the shipping format
# is `[format]` in crates/kx-theme/tokens/sounds.toml. Each layer, one TOML 1.1 inline table, is a filtered noise burst
# or a set of damped sine partials; times are in ms, levels are relative, and `decay_ms` is the time to fall 60 dB after
# the rise.

[variants]
# The largest pitch change of a variant, up or down, in cents (100 is a semitone).
pitch_cents = 35
# The largest level drop of a variant, in dB.
level_db = 1.0

[resample]
# Sinc zero crossings on each side of a sample.
half_taps = 32
# The cutoff, as a share of the lower Nyquist frequency.
rolloff = 0.94

# A soft scissor laptop key: a light tick and a short, high plastic body.
[[recipe]]
name = "key-laptop"
length_ms = 70
gain_db = -1
variants = 3
layer = [
    { kind = "noise", filter = "bandpass", hz = 4200, q = 0.8,
      start_ms = 0, attack_ms = 0.2, decay_ms = 4, level = 0.6 },
    { kind = "noise", filter = "bandpass", hz = 2200, q = 1.3,
      start_ms = 0.5, attack_ms = 0.4, decay_ms = 20, level = 1.0 },
    { kind = "noise", filter = "bandpass", hz = 600, q = 1.2,
      start_ms = 0.5, attack_ms = 0.8, decay_ms = 24, level = 0.6 },
    { kind = "modes", start_ms = 0.5, attack_ms = 0.4, level = 0.35, partials = [
        { hz = 1850, decay_ms = 18, level = 1.0 },
        { hz = 2700, decay_ms = 12, level = 0.6 },
        { hz = 1150, decay_ms = 24, level = 0.5 },
    ] },
]

