[package]
name = "kx-mod-clipboard"
description = "Clipboard history: a private, paged history of copies, sealed on disk in day folders."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The clipboard and calendar ports, the panel's types and the shared search folding.
kx-module-api = { path = "../kx-module-api" }
# The settings and the compiled-in media table.
serde.workspace = true
toml.workspace = true
# The store's error type.
thiserror.workspace = true
# Error kinds and counts only, never clipboard content.
tracing.workspace = true

[dev-dependencies]
kx-platform-fake = { path = "../kx-platform-fake" }
# The kernel's settings repair, for the bad-value test.
kx-settings = { path = "../kx-settings" }
kx-test-support = { path = "../kx-test-support" }
proptest.workspace = true
