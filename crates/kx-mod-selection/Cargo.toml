[package]
name = "kx-mod-selection"
description = "Selection chips: Copy, Cut, Paste and Translate keycaps by selected text, and Paste at a caret."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The selection and link ports, the chips' events, the clock's time and the hidden marks.
kx-module-api = { path = "../kx-module-api" }
# The settings and the compiled-in site table.
serde.workspace = true
toml.workspace = true
# The site table's error type.
thiserror.workspace = true
# Error kinds only, never text, a link or a box.
tracing.workspace = true

[dev-dependencies]
# The selection watch, the web link and the clock the tests script.
kx-platform-fake = { path = "../kx-platform-fake" }
# The kernel's settings repair, for the bad-value tests.
kx-settings = { path = "../kx-settings" }
kx-test-support = { path = "../kx-test-support" }
proptest.workspace = true
