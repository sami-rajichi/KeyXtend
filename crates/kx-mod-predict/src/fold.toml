# Arabic: harakat, the superscript alef and tatweel go; the hamza and wasla alef forms fold to bare alef, and alef
# maksura to ya. Ta marbuta, hamza on waw or ya, and every other letter stay.
[arabic]
drop = [
    "\u064B", # fathatan
    "\u064C", # dammatan
    "\u064D", # kasratan
    "\u064E", # fatha
    "\u064F", # damma
    "\u0650", # kasra
    "\u0651", # shadda
    "\u0652", # sukun
    "\u0670", # superscript alef
    "\u0640", # tatweel
]

[arabic.map]
"\u0623" = "\u0627" # alef with hamza above to alef
"\u0625" = "\u0627" # alef with hamza below to alef
"\u0622" = "\u0627" # alef with madda to alef
"\u0671" = "\u0627" # alef wasla to alef
"\u0649" = "\u064A" # alef maksura to ya
