# Folding for loose matching (spec §6 "Matching", ADR-0032 decision 5): `fold.rs` lower-cases a word, then drops
# each `drop` character and replaces each `map` key. Keys are lower case, as folding lower-cases first.

# Latin-1 Supplement and Latin Extended-A, after Lucene's ASCIIFoldingFilter: accents go, ligatures spell out.
[latin]
# İ lower-cases to i and this combining dot above, so the dot goes.
drop = ["\u0307"]

[latin.map]
"ß" = "ss"
"à" = "a"
