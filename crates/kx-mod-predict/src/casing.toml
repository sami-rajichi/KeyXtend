# Casing by language: the language rows of Unicode's SpecialCasing.txt (Unicode 16.0.0,
# https://www.unicode.org/Public/16.0.0/ucd/SpecialCasing.txt) for the packs we ship, copied from the published text
# as no copy of the file was on this PC. `casing.rs` reads it; a language without a section cases as Unicode's default.
#
# Each row is a text with its lower, title and upper forms. Left out: az (the same rows as tr, but no pack), and lt,
# whose rows only add or drop U+0307 around i, which no lt spelling holds, so they would only stop lookups matching.

[tr]
rows = [
    # 0130; 0069; 0130; 0130; tr  (İ lowers to i)
    { text = "İ", lower = "i", title = "İ", upper = "İ" },
    # 0049 0307 under After_I and Not_Before_Dot: I before a dot above lowers to i, and the dot goes.
    { text = "İ", lower = "i", title = "İ", upper = "İ" },
    # 0049; 0131; 0049; 0049; tr Not_Before_Dot  (I lowers to ı)
    { text = "I", lower = "ı", title = "I", upper = "I" },
    # 0069; 0069; 0130; 0130; tr  (i capitalises to İ)
    { text = "i", lower = "i", title = "İ", upper = "İ" },
]
# fold.toml folds ı to i; Turkish keeps them apart, as they are two letters.
keep = ["ı"]
