[package]
name = "kx-mod-predict"
description = "Word prediction: word chips that finish the word and guess the next one, learned on the device, with emails."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The pack writer, for `cargo xtask words` and the tests only: the app reads packs and never writes one, so
# `cargo xtask tidy` refuses this feature in its tree.
build = []

[dependencies]
# The ports, the bus events and the packs port's file limits (`MAX_PACK_BYTES`).
kx-module-api = { path = "../kx-module-api" }
# The lexicon of each word pack: an FST map from folded keys to runs of word ids (ADR-0032).
fst = "0.4.7"
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
kx-platform-fake = { path = "../kx-platform-fake" }
kx-test-support = { path = "../kx-test-support" }
proptest.workspace = true
