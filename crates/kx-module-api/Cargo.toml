[package]
name = "kx-module-api"
description = "The contract between the kernel and feature modules: ids, manifests, services, events, settings, time and redaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The worker's facts, re-exported beside the pictures and boxes ports so the settings that size them follow them.
kx-ipc = { path = "../kx-ipc" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
# A panel line's caret steps over whole graphemes (`caret`).
unicode-segmentation.workspace = true
# Wipes saved values and passwords when dropped (`Secret`), as kx-crypto wipes its keys.
zeroize.workspace = true

[dev-dependencies]
# The shared fake host and fake platform; both depend on this crate, which Cargo allows for tests.
kx-platform-fake = { path = "../kx-platform-fake" }
kx-test-support = { path = "../kx-test-support" }
proptest.workspace = true
serde_json.workspace = true
