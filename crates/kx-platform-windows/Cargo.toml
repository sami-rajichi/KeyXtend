[package]
name = "kx-platform-windows"
description = "The Windows adapter: the only product crate that calls Win32 for the clock, folders, COM, uiAccess, input, shortcuts, the power dialog, the mouse hook, layouts, windows, scrolling other apps, the system look, the heaps' free memory, sound, the data key's guard, the word packs, UI Automation and the focused box."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The pointer hook's simulated source, which acts only on the gate tool's `SIM_TAG` input. Test builds only: the shipped
# app never turns it on, so the code is not even built there, on top of the stage check that refuses the flag.
sim-input = []

[dependencies]
# The `KeyGuard` trait that DPAPI implements, and Windows' device names that no pack code may be.
kx-crypto = { path = "../kx-crypto" }
kx-module-api = { path = "../kx-module-api" }
kx-platform = { path = "../kx-platform" }
# The compiled-in shortcut and key-name tables.
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
# The pointer hook and the speaker log counts, error codes and waits only.
tracing.workspace = true

# The OS calls are Windows-only; the pure maths builds and tests everywhere.
[target.'cfg(windows)'.dependencies]
# The accent pair comes from WinRT's `UISettings` (`UI_ViewManagement`); DWM gives the backdrops, DXGI ranks the
# graphics adapters by power, the heap calls give free pages back and map the word packs (`System_Memory`,
# `System_SystemServices`), the mouse hook reads the tick count (`System_SystemInformation`) and tests the input
# desktop (`System_StationsAndDesktops`), the speaker plays through XAudio2, the Lock PC shortcut locks the session
# (`System_Shutdown`), DPAPI guards the data key (`Security_Cryptography`), and UI Automation reads arrays and builds
# conditions (`System_Ole`, `System_Variant`).
windows = { workspace = true, features = [
    "UI",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio_XAudio2",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The `implement` macro behind the field watch's focus handler names this crate.
windows-core.workspace = true

[dev-dependencies]
kx-test-support = { path = "../kx-test-support" }
proptest.workspace = true
