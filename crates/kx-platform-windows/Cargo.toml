[package]
name = "kx-platform-windows"
description = "The Windows adapter: the only product crate that calls Win32 for the clock, folders, COM, uiAccess, input injection and layouts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
kx-module-api = { path = "../kx-module-api" }
kx-platform = { path = "../kx-platform" }
thiserror.workspace = true

# The OS calls are Windows-only; the pure maths builds and tests everywhere.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest.workspace = true
