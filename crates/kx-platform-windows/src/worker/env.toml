# The worker's environment (ADR-0044): the only variables of ours it inherits, matched in any case. Windows itself,
# the temporary folders, the user's folders a graphics driver keeps its shader cache in, and the processor's facts.
keep = [
    "SystemRoot",
    "SystemDrive",
    "windir",
    "TEMP",
    "TMP",
    "USERPROFILE",
    "LOCALAPPDATA",
    "APPDATA",
    "ProgramData",
    "ALLUSERSPROFILE",
    "PUBLIC",
    "ProgramFiles",
    "ProgramFiles(x86)",
    "ProgramW6432",
    "CommonProgramFiles",
    "CommonProgramFiles(x86)",
    "CommonProgramW6432",
    "NUMBER_OF_PROCESSORS",
    "PROCESSOR_ARCHITECTURE",
    "PROCESSOR_IDENTIFIER",
    "PROCESSOR_LEVEL",
    "PROCESSOR_REVISION",
    "OS",
]
# The search path, which the worker gets as the system folders alone, never ours.
path = "PATH"
# What separates the folders in it.
path_gap = ";"
# Starts no kept name may have: the engine's settings and the Vulkan loader's driver and layer lists.
banned = ["GGML_", "TRANSCRIBE_", "VK_"]
