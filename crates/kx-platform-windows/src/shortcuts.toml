# Each shortcut id with its steps, sent in order. A step names keys from `keynames.toml`: the last is tapped and the
# others held in order. `call = "lock"` means Windows does it with an OS call; its steps still name the keys for the tip.
shortcuts = [
    { id = "copy", steps = [["ctrl", "c"]] },
    { id = "paste", steps = [["ctrl", "v"]] },
    { id = "cut", steps = [["ctrl", "x"]] },
    { id = "select-all", steps = [["ctrl", "a"]] },
    { id = "undo", steps = [["ctrl", "z"]] },
    { id = "redo", steps = [["ctrl", "y"]] },
    { id = "copy-all", steps = [["ctrl", "a"], ["ctrl", "c"]] },
    { id = "cut-all", steps = [["ctrl", "a"], ["ctrl", "x"]] },
    { id = "delete-all", steps = [["ctrl", "a"], ["del"]] },
    { id = "find", steps = [["ctrl", "f"]] },
    { id = "save", steps = [["ctrl", "s"]] },
    { id = "print", steps = [["ctrl", "p"]] },
    { id = "emoji", steps = [["win", "period"]] },
    # Windows keeps this switcher open after the keys go up.
    { id = "switch-app", steps = [["ctrl", "alt", "tab"]] },
    { id = "show-desktop", steps = [["win", "d"]] },
    { id = "file-explorer", steps = [["win", "e"]] },
    # Windows ignores an injected Win+L, so `LockWorkStation` locks.
    { id = "lock-pc", steps = [["win", "l"]], call = "lock" },
    { id = "task-manager", steps = [["ctrl", "shift", "esc"]] },
    { id = "close-window", steps = [["alt", "f4"]] },
    { id = "new-tab", steps = [["ctrl", "t"]] },
    { id = "close-tab", steps = [["ctrl", "w"]] },
    { id = "reopen-tab", steps = [["ctrl", "shift", "t"]] },
    { id = "refresh", steps = [["f5"]] },
    # The number pad's keys: one place in every layout, and Word does not take them for subscript.
    { id = "zoom-in", steps = [["ctrl", "numplus"]] },
    { id = "zoom-out", steps = [["ctrl", "numminus"]] },
    { id = "f1", steps = [["f1"]] },
    { id = "f2", steps = [["f2"]] },
    { id = "f3", steps = [["f3"]] },
    { id = "f4", steps = [["f4"]] },
    { id = "f5", steps = [["f5"]] },
    { id = "f6", steps = [["f6"]] },
    { id = "f7", steps = [["f7"]] },
    { id = "f8", steps = [["f8"]] },
    { id = "f9", steps = [["f9"]] },
    { id = "f10", steps = [["f10"]] },
    { id = "f11", steps = [["f11"]] },
    { id = "f12", steps = [["f12"]] },
]
