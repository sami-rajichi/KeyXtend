# The Windows clipboard formats of the clipboard history (spec §7, ADR-0034), compiled in.
# Registered formats go by name, which Windows matches without case; the standard ones (CF_UNICODETEXT, CF_DIBV5,
# CF_DIB, CF_HDROP) are Windows constants in the code.

# Formats whose presence alone asks history tools to leave a copy out; such a copy is never read.
skip = ["ExcludeClipboardContentFromMonitorProcessing", "Clipboard Viewer Ignore"]
# Formats holding a 32-bit number, where 0 asks the same.
skip_zero = ["CanIncludeInClipboardHistory"]
# The marker every write of ours sets to 0, so neither our watch nor Windows' own history keeps it.
marker = "CanIncludeInClipboardHistory"
# Also set to 0 on every write of ours, so Windows never syncs it to the user's other devices.
cloud_off = "CanUploadToCloudClipboard"

# The registered formats we keep and set again.
html = "HTML Format"
rtf = "Rich Text Format"
png = "PNG"
# Whether a file list is a copy or a move; ours always say copy.
drop_effect = "Preferred DropEffect"

# The app that made a copy, named from its file's version information.
[app]
# The most bytes of version information read.
version_bytes = 65536
# The longest app name kept, in characters.
name_chars = 80
