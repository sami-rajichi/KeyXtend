# The models table (ADR-0043): one row per model file the Voice panel downloads on the user's click; none ships.
# The rows are the ten files of the 2026-11-10 trial (docs/items/P11.md), licences and credits as THIRD_PARTY.md.
#
# Each row:
# - `id`: the name `picks` stores; `name`: the shown name; `runner`: the engine adapter that reads it.
# - `file`, `bytes`, `sha256`: the file and the size and SHA-256 checked before it takes its name.
# - `links`: HTTPS addresses at a fixed revision, tried in order; `hosts`: the hosts a link or its redirect may reach,
#   as a HEAD request on 2026-11-14 showed them (huggingface.co, then its CDN).
# - `licence`, `credit`, `origin`: the licence, who to credit and the original model's page.
# - `cpu_mb`: the system memory a job needs: the larger of peak working set and peak commit over the trial's processor
#   and card runs (8 threads, clips up to 31.5 s), plus 25 %, rounded up to 64 MB.
# - `card_mb`: the card memory it takes: card free memory before the run less after it (RTX 4060 Laptop, Vulkan), plus
#   25 %, rounded up to 64 MB; `card_margin_mb` is added when it is checked against a card.
# - `live`: it can write while hearing (recorded, unused); `lead`: false keeps it from heading any order (never a default).
# - `langs`: each keyboard language (ISO 639) and the model's own code for it, as the engine listed them; a model with
#   region codes takes the first region it lists, and `jv`, `nb` and `fil` reach Whisper's `jw`, `no` and `tl`.

# File extensions a model file may have; the folder scan lists these, in any case.
exts = ["gguf", "bin"]
# The licences a row may name.
licences = ["MIT", "Apache-2.0", "CC-BY-4.0", "OpenMDW-1.1"]
# The runners the worker's engine knows (ADR-0043 decision 1).
runners = ["transcribe"]
# Hex digits of the commit every address names as one part of its path, so it never follows a moving branch.
revision = 40
# The languages of the card check's clips shipped in assets/voice; a model takes the first one it knows.
clips = ["en", "fr", "ar"]

