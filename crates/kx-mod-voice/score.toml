# Scoring rules for Compare's words wrong and a card check's words apart (design "Compare models", ADR-0044 decision 7).
# `score.rs` lower-cases a text by its language and applies the rules below, then cuts words at each character that is
# not a letter, a digit or the apostrophe; a word wrong is one word put in, left out or changed.

# Rules every language takes.
[base]
# Quote marks a model may write for the apostrophe, read as the shared table's one (kx-module-api `text/fold.toml`).
apostrophes = ["‘", "ʼ"]

# English: a digit counts as its number word.
[langs.en]
words = { "0" = ["zero"], "1" = ["one"], "2" = ["two"], "3" = ["three"], "4" = ["four"], "5" = ["five"], "6" = ["six"], "7" = ["seven"], "8" = ["eight"], "9" = ["nine"], "10" = ["ten"] }

# French: accents count, as a missing one can change the word (a, à; ou, où); a digit counts as its number word.
[langs.fr]
words = { "0" = ["zéro"], "1" = ["un", "une"], "2" = ["deux"], "3" = ["trois"], "4" = ["quatre"], "5" = ["cinq"], "6" = ["six"], "7" = ["sept"], "8" = ["huit"], "9" = ["neuf"], "10" = ["dix"] }

# Arabic is strict: ة, the hamza forms (أ إ آ ؤ ئ ء) and ى stay apart from ه, bare alef, waw, ya and ي, as each is a
# spelling the user would fix. Only marks and tatweel go, Arabic-Indic digits read as digits, and a digit counts as its
# number word in either gender.
[langs.ar]
# The shared table's drops within the Arabic block: the harakat (U+064B to U+0652), superscript alef and tatweel.
marks = { from = "؀", to = "ۿ" }
# A letter written as two parts, joined as Unicode composes it, so ا with U+0654 is أ.
join = { "آ" = "آ", "أ" = "أ", "إ" = "إ", "ؤ" = "ؤ", "ئ" = "ئ" }
words = { "0" = ["صفر"], "1" = ["واحد", "واحدة"], "2" = ["اثنان", "اثنين", "اثنتان", "اثنتين"], "3" = ["ثلاثة", "ثلاث"], "4" = ["أربعة", "أربع"], "5" = ["خمسة", "خمس"], "6" = ["ستة", "ست"], "7" = ["سبعة", "سبع"], "8" = ["ثمانية", "ثماني", "ثمان"], "9" = ["تسعة", "تسع"], "10" = ["عشرة", "عشر"] }

[langs.ar.map]
"٠" = "0" # Arabic-Indic digit zero
"١" = "1"
"٢" = "2"
"٣" = "3"
"٤" = "4"
"٥" = "5"
"٦" = "6"
"٧" = "7"
"٨" = "8"
"٩" = "9"
"۰" = "0" # Eastern Arabic-Indic digit zero, as Persian and Urdu keyboards type it
"۱" = "1"
"۲" = "2"
"۳" = "3"
"۴" = "4"
"۵" = "5"
"۶" = "6"
"۷" = "7"
"۸" = "8"
"۹" = "9"
