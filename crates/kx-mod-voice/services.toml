# The services table (ADR-0047 decisions 5 to 9): one row per cloud service in the Cloud page's order, Groq first, its
# card filled with facts read on the service's own pages on the day noted and written nowhere else. Nothing here is a
# default; this file holds the table-wide values and upload-form rows, and `services-own.toml` the rest, read after it.
#
# Table-wide:
# - `light_hours`, `heavy_hours`: the hours of sound a month of light and of heavy use, which the cards' prices cover.
# - `room_kb`: the room kept under a service's own request cap for the WAV header and the form's other parts.
# - `max_models`: the most models a row offers (design "Connections and services").
# - `[reply]`: replies stay plain text or JSON without timings: a fixed field named in `formats` asks only for one of
#   `plain`, and one named in `timings` only for one of `untimed`.
# - The language sets live in `langs.toml`; a model's `langs` may name one in place of its own list.
#
# Each row ([[services]]):
# - `id`: the name `services`, `picks` and the key's sealed blob use; `name`: the shown name, left out for Custom,
#   which the ui names in the user's language.
# - `shape`: "form", "eleven", "gemini" or "assembly"; `form`: an upload form's or `ElevenLabs`' language field, whether
#   it goes as a list (`[]`), and its fixed fields; `model_header`: the header `AssemblyAI`'s model goes in; `keep`: a
#   field sent while the keep-nothing switch is on, which gives the row that switch; `paywall`: a form's 403 asks the
#   account to pay (a missing payment method or a spending cap), so it tells the account's step; `region`: the error
#   code by which a form's reply says the service is not offered in the user's country or region.
# - `host`: the only host its requests reach; for a typed address, the `.` domain it must be under, or none for
#   Custom, which takes any HTTPS host name.
# - `address`: where the pieces go, or "typed"; `test`: the key's test address, a path under a typed host, or none.
# - `header`: "bearer" for `Authorization: Bearer`, else the name of the header that carries the key alone.
# - `keys`: the page where the key is made.
# - `limits`: the service's own cap a request, `cap_mb` (read as 10^6 bytes) and `cap_s` when it names one; then a
#   piece's `max_mb` (MiB) and `max_s`, each with `room_kb` left under the cap, `per_min` requests a minute and
#   `at_once` at once.
# - `other`: an Other model line takes a typed id, sent with the keyboard's language code as it is.
# - `terms`: raised when the training, retention or region fact changes, so the user confirms again.
# - `offered`: shown on the Cloud page, only for a service the owner can test by hand; a row not offered stays built
#   and tested but is never shown, picked or sent to (ADR-0050). `untested`: no real key has checked it yet.
# - `[[services.models]]`: each `id`, shown `name`, its `langs` (the code it wants per keyboard language, or the name
#   of a set in `langs.toml`), maybe its own `form`, `unnamed = true` when the request names no model, and `keeps` when
#   every host of it keeps the voice.
# - `[services.facts]`: the day `read` and its `source` page, the `currency`, and the card's facts: each a text `id`
#   with its values by kind (`count`, `number`, `money`, `day`, `text`) and `warn` for the warning tone. The optional
#   `warn` fact is the card's warning, `bills` the least a request bills when the service rounds up, and `rule` a rule
#   the service sets on its use.

light_hours = 15
heavy_hours = 60
room_kb = 64
max_models = 10

[reply]
formats = ["response_format"]
plain = ["json", "text"]
timings = ["timestamp_granularities", "timestamps_granularity"]
untimed = ["none"]

# Groq: console.groq.com docs read 2026-11-17 (speech-to-text, rate-limits, models, billing-faqs, your-data, and the
# services agreement section 4.2). The free plan's 20 requests a minute and 28,800 audio seconds a day; 25 MB a file.
[[services]]
id = "groq"
name = "Groq"
shape = "form"
form = { lang = "language", list = false, fixed = [] }
host = "api.groq.com"
address = "https://api.groq.com/openai/v1/audio/transcriptions"
test = "https://api.groq.com/openai/v1/models"
header = "bearer"
keys = "https://console.groq.com/keys"
# `at_once` is not stated on its pages: a guess, checked at task 24.
limits = { cap_mb = 25, max_mb = 23, max_s = 600, per_min = 20, at_once = 4 }
other = true
terms = 1
offered = true
untested = true

[[services.models]]
id = "whisper-large-v3-turbo"
name = "Whisper Large v3 Turbo"
langs = "whisper"

[[services.models]]
id = "whisper-large-v3"
name = "Whisper Large v3"
langs = "whisper"

[services.facts]
read = 2026-11-17
source = "https://console.groq.com/docs/your-data"
currency = "USD"
place = { id = "us" }
trains = { id = "never" }
keeps = { id = "logs", count = { days = 30 }, text = { switch = "Settings → Data Controls" } }
free = { id = "daily", count = { hours = 8, per_min = 20 } }
light = { id = "free-or", money = { low = 0.60, high = 1.67 } }
heavy = { id = "free-or", money = { low = 2.40, high = 6.66 } }
bills = { id = "least", count = { seconds = 10 } }

# OpenAI: developers.openai.com read 2026-11-17 (pricing, speech-to-text, the transcriptions reference, rate limits, error
# codes, your data). Only gpt-transcribe, with `languages[]`; 25 MB a file, nothing kept for abuse checks, no free use.
[[services]]
id = "openai"
name = "OpenAI"
shape = "form"
# `language` is for a typed Other id; the old models that take it shut down on 2027-02-26.
form = { lang = "language", list = false }
region = "unsupported_country_region_territory"
host = "api.openai.com"
address = "https://api.openai.com/v1/audio/transcriptions"
test = "https://api.openai.com/v1/models"
header = "bearer"
keys = "https://platform.openai.com/api-keys"
# Its rates are not listed: `per_min` and `at_once` are guesses, checked at task 24.
limits = { cap_mb = 25, max_mb = 23, max_s = 600, per_min = 50, at_once = 4 }
other = true
terms = 1
# Hidden until the owner tests it, as it needs a card or a payment before any use (ADR-0050).
offered = false
untested = true

[[services.models]]
id = "gpt-transcribe"
name = "GPT Transcribe"
langs = "iso-639-1"
form = { lang = "languages", list = true }

[services.facts]
read = 2026-11-17
source = "https://developers.openai.com/api/docs/guides/your-data"
currency = "USD"
place = { id = "us" }
trains = { id = "opt-in" }
keeps = { id = "none" }
free = { id = "none" }
light = { id = "plain", money = { price = 4.05 } }
heavy = { id = "plain", money = { price = 16.20 } }

