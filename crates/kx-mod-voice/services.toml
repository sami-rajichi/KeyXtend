    he = "he", hi = "hi", hr = "hr", ht = "ht", hu = "hu", hy = "hy", id = "id", is = "is", it = "it", ja = "ja",
    jv = "jw", ka = "ka", kk = "kk", km = "km", kn = "kn", ko = "ko", la = "la", lb = "lb", ln = "ln", lo = "lo",
    lt = "lt", lv = "lv", mg = "mg", mi = "mi", mk = "mk", ml = "ml", mn = "mn", mr = "mr", ms = "ms", mt = "mt",
    my = "my", nb = "no", ne = "ne", nl = "nl", nn = "nn", no = "no", oc = "oc", pa = "pa", pl = "pl", ps = "ps",
    pt = "pt", ro = "ro", ru = "ru", sa = "sa", sd = "sd", si = "si", sk = "sk", sl = "sl", sn = "sn", so = "so",
    sq = "sq", sr = "sr", su = "su", sv = "sv", sw = "sw", ta = "ta", te = "te", tg = "tg", th = "th", tk = "tk",
