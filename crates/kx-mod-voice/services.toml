# The services table (ADR-0047 decisions 5 to 9): one row per cloud service, in the Cloud page's order, Groq first. A
# card's sentences are translations filled with a row's facts, read on the service's own pages on the day noted; no
# price or claim is written anywhere else. Nothing here is a default: a service stays off until the user confirms it.
#
# Table-wide:
# - `light_hours`, `heavy_hours`: the hours of sound a month of light and of heavy use, which the cards' prices cover.
# - `room_kb`: the room kept under a service's own request cap for the WAV header and the form's other parts.
# - `max_models`: the most models a row offers (design "Connections and services").
# - `[reply]`: replies stay plain text or JSON without timings: a fixed field named in `formats` asks only for one of
#   `plain`, and one named in `timings` only for one of `untimed`.
#
# Each row ([[services]]):
# - `id`: the name `services`, `picks` and the key's sealed blob use; `name`: the shown name, left out for Custom,
#   which the ui names in the user's language.
# - `shape`: "form", "azure", "eleven" or "gemini"; `form`: a form's language field, whether it goes as a list (`[]`)
#   and its fixed fields; `keep`: a field sent while the keep-nothing switch is on, which gives the row that switch.
# - `host`: the only host its requests reach; for a typed address, the `.` domain it must be under, or none for
#   Custom, which takes any HTTPS host name.
# - `address`: where the pieces go, or "typed"; `test`: the key's test address, a path under a typed host, or none.
# - `header`: "bearer" for `Authorization: Bearer`, else the name of the header that carries the key alone.
# - `keys`: the page where the key is made.
# - `limits`: the service's own cap a request, `cap_mb` (read as 10^6 bytes) and `cap_s` when it names one; then a
#   piece's `max_mb` (MiB) and `max_s`, each with `room_kb` left under the cap, `per_min` requests a minute and
#   `at_once` at once.
# - `other`: an Other model line takes a typed id, sent with the keyboard's language code as it is.
# - `terms`: raised when the training, retention or region fact changes, so the user confirms again.
# - `offered`: shown on the Cloud page; `untested`: no real key has checked the connection yet.
# - `[[services.models]]`: each `id`, shown `name`, the code it wants per keyboard language, maybe its own `form`,
#   `unnamed = true` when the request names no model, and `keeps` when every host of it keeps the voice.
# - `[services.facts]`: the day `read` and its `source` page, the `currency`, and the card's facts: each a text `id`
#   with its values by kind (`count`, `number`, `money`, `day`, `text`) and `warn` for the warning tone.

light_hours = 15
heavy_hours = 60
room_kb = 64
max_models = 10

[reply]
formats = ["response_format"]
plain = ["json", "text"]
timings = ["timestamp_granularities", "timestamps_granularity"]
untimed = ["none"]

# Groq: console.groq.com docs read 2026-11-17 (speech-to-text, rate-limits, models, billing-faqs, your-data, and the
# services agreement section 4.2). The free plan's 20 requests a minute and 28,800 audio seconds a day; 25 MB a file.
[[services]]
id = "groq"
name = "Groq"
shape = "form"
form = { lang = "language", list = false, fixed = [] }
host = "api.groq.com"
address = "https://api.groq.com/openai/v1/audio/transcriptions"
test = "https://api.groq.com/openai/v1/models"
header = "bearer"
keys = "https://console.groq.com/keys"
limits = { cap_mb = 25, max_mb = 23, max_s = 600, per_min = 20, at_once = 4 }
other = true
terms = 1
offered = true
untested = true

[[services.models]]
