# OpenRouter: openrouter.ai docs read 2026-11-17 (speech-to-text, the transcriptions reference, models, pricing, ZDR,
# provider routing, limits, errors, the key endpoint). One key routes to many hosts; `provider.zdr` sends only to hosts
# that keep nothing, on to start (edge 17); a 402 is no credit and a 403 a key's spending cap; a 5.5% fee on credit.
[[services]]
id = "openrouter"
name = "OpenRouter"
shape = "form"
form = { lang = "language", list = false }
keep = { name = "provider", value = '{"zdr":true}' }
paywall = true
host = "openrouter.ai"
address = "https://openrouter.ai/api/v1/audio/transcriptions"
test = "https://openrouter.ai/api/v1/key"
header = "bearer"
keys = "https://openrouter.ai/settings/keys"
# A piece lasts at most the 60 s upstream timeout a request [R1].
# `per_min` and `at_once` are not on its pages: guesses, checked at task 24.
limits = { cap_mb = 25, max_mb = 23, max_s = 60, per_min = 60, at_once = 4 }
other = true
terms = 1
offered = true
untested = true

[[services.models]]
id = "openai/whisper-large-v3-turbo"
name = "Whisper Large v3 Turbo"
langs = "whisper"

[[services.models]]
id = "openai/whisper-large-v3"
name = "Whisper Large v3"
langs = "whisper"

