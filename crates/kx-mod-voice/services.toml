[services.facts]
read = 2026-11-17
source = "https://console.groq.com/docs/your-data"
currency = "USD"
place = { id = "us" }
trains = { id = "never" }
keeps = { id = "logs", count = { days = 30 }, text = { switch = "Settings → Data Controls" } }
free = { id = "daily", count = { hours = 8, per_min = 20 } }
light = { id = "free-or", money = { low = 0.60, high = 1.67 } }
heavy = { id = "free-or", money = { low = 2.40, high = 6.66 } }

# Custom (design "Connections and services"): any service that speaks the upload form, such as the user's own server,
# at an HTTPS host name the user types with its model; its card says the facts are that service's own.
[[services]]
id = "custom"
shape = "form"
form = { lang = "language", list = false, fixed = [] }
address = "typed"
header = "bearer"
limits = { cap_mb = 25, max_mb = 23, max_s = 600, per_min = 20, at_once = 2 }
other = true
terms = 1
offered = true
untested = true

