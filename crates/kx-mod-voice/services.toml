    la = "latin", lb = "luxembourgish", ln = "lingala", lo = "lao", lt = "lithuanian", lv = "latvian",
    mg = "malagasy", mi = "maori", mk = "macedonian", ml = "malayalam", mn = "mongolian", mr = "marathi",
