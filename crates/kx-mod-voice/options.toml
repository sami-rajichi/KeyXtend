# The Voice panel's Options page (design "The gear and the Voice panel", mock-up design/voice-bar.js): one row per
# [voice] key, in the mock-up's order. Switches and minus and plus steppers only, no slider (ADR-0008).
#
# - `key`: the setting, which also names the row's text.
# - `kind`: "switch" (on or off), "number" (a whole number), "factor" (kept in hundredths) or "place" (the bar's places,
#   with chevrons).
# - `steps`: the values minus and plus walk through; without it a number moves by `step`. A value the settings' own
#   check refuses is skipped, so each range stays in one place.
# - `under`: the switch that makes the row live; `auto`: 0 reads as the processor's real cores.
# - `unit`: how a number reads, which names its text (kx-module-api `OptionUnit`); every number has one.

[[rows]]
key = "sounds"
kind = "switch"

[[rows]]
key = "silence_stop"
kind = "switch"

[[rows]]
key = "silence_stop_s"
kind = "number"
unit = "seconds"
step = 1
under = "silence_stop"

[[rows]]
key = "done_ms"
kind = "number"
unit = "ms_as_seconds"
step = 1000

[[rows]]
key = "place"
kind = "place"

[[rows]]
key = "history"
kind = "switch"

[[rows]]
key = "history_max"
kind = "number"
unit = "texts"
steps = [1, 10, 20, 50, 100, 200, 500]
under = "history"

[[rows]]
key = "keep_voice"
kind = "switch"

[[rows]]
key = "voice_max_mb"
kind = "number"
unit = "mb"
steps = [64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]
under = "keep_voice"

[[rows]]
key = "idle_min"
kind = "number"
unit = "minutes"
steps = [1, 2, 5, 10, 15, 30, 60, 120]

[[rows]]
key = "record_max_s"
kind = "number"
unit = "seconds_or_minutes"
steps = [10, 30, 60, 120, 300, 600, 1200, 1800, 3600]

[[rows]]
key = "nothing_s"
kind = "number"
unit = "seconds"
step = 1

[[rows]]
key = "debounce_ms"
kind = "number"
unit = "ms"
steps = [100, 200, 300, 400, 600, 800, 1000, 1500, 2000]

[[rows]]
key = "type_suffix"
kind = "switch"

[[rows]]
key = "type_gap_ms"
kind = "number"
unit = "ms"
steps = [0, 5, 10, 20, 50, 100, 200]

[[rows]]
key = "threads"
kind = "number"
unit = "count"
step = 1
auto = true

[[rows]]
key = "wave_ms"
kind = "number"
unit = "ms"
steps = [0, 100, 200, 300, 500, 1000, 2000]

[[rows]]
key = "min_free_mb"
kind = "number"
unit = "mb"
steps = [256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536]

[[rows]]
key = "card_margin_mb"
kind = "number"
unit = "mb"
steps = [0, 256, 512, 1024, 2048, 4096, 8192]

[[rows]]
key = "card_gain"
kind = "factor"
steps = [1.0, 1.25, 1.5, 2.0, 3.0, 5.0, 10.0]

[[rows]]
key = "card_diff"
kind = "number"
unit = "words"
step = 1
