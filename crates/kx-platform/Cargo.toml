[package]
name = "kx-platform"
description = "The platform ports: what an OS adapter hands the kernel and the UI, the data folder rule, and the neutral pack, field-watch and worker-host rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The frames the worker host writes and checks (ADR-0004).
kx-ipc = { path = "../kx-ipc" }
kx-module-api = { path = "../kx-module-api" }
thiserror.workspace = true
# The field watch and the worker host log why they stopped, never what they read.
tracing.workspace = true

[dev-dependencies]
kx-test-support = { path = "../kx-test-support" }
