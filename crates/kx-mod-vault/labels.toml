# The labels a field takes from the table (design "The notebook"), each listed once in the order Add a field offers
# them: `id` names it and its text `fill.label-<id>`, `hidden` starts its field hidden, `emails` shows its values in the
# `@@` list, and `make` offers Make one on its field.
# The ids are saved in the notebook, so changing one needs a new `VERSION` in `src/store/codec.rs`.

