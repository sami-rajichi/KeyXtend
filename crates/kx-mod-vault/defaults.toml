# The most characters one saved value, name or own label holds; its top is the vault worker's cap.
field_chars = 1000
# The most entries the notebook holds; its top is the vault worker's cap.
max_entries = 2000
# The most fields one entry holds; its top is the vault worker's cap.
max_fields = 30
# The characters of a password that Make one makes.
make_chars = 20
# The wait after the last change before every backup box is rewritten, in ms.
box_delay_ms = 2000
# The fewest characters a backup password takes.
box_min_chars = 8
# Days between memory checks of the backup password, one step after each right answer; the last one repeats.
check_days = [1, 3, 7, 14, 30]
# Wrong answers a memory check takes before a new backup password must be set.
check_tries = 5
# Memory checks of the backup password ask now and then.
memory_checks = true
# The wait after the Tab that Both types between the user and the password, in ms.
tab_gap_ms = 150
# The largest backup box, in MB; its top is the vault worker's cap.
box_mb = 16
# The scrypt work factor (log N) that locks a new padlock; 20 needs 1 GiB, the vault worker's cap.
box_work = 18
# The longest one vault worker call may take, in ms, before the worker is stopped.
vault_ms = 20000
# Seconds the vault worker may sit idle before it stops.
worker_idle_s = 30
# The wait before a failed vault worker starts again, in ms; it doubles with each failure.
restart_ms = 1000
# The longest wait before a failed vault worker starts again, in ms.
restart_max_ms = 30000
# How long Paste waits for the clipboard history, in ms; it outlasts the history's longest open wait (open_ms up to 2000).
paste_wait_ms = 3000
# Seconds between looks at a backup place that waits to come back or to have room, and between tries of a failed save.
place_check_s = 60
# Hours before a memory check asks again after Later.
later_h = 24
