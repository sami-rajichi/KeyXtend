# Latched modifiers: "release" after the next key, or "stay" until clicked again.
modifiers = "release"
# How the language key shows the layouts: "carousel", "cycle" or "list".
lang_key = "carousel"
# The keyboard's size as a factor of the size-1 board; the module writes it when the user resizes.
size = 1.0
# The S, M and L sizes.
presets = [1.0, 1.25, 1.5]
# Change per smaller or bigger click, and the smallest and largest sizes.
# A hand-edited file may set size_min down to SIZE_FLOOR and size_max up to SIZE_CEILING (src/settings.rs); past
# those, a value goes back to default.
size_step = 0.05
size_min = 0.8
size_max = 1.8
# How often the labels follow the layout of the app in front and the Caps Lock light follows the key, in ms.
relabel_ms = 500
# Held typing keys repeat, as on a physical keyboard; with false, a held key types once, at the press.
repeat = true
# How long a key is held before it repeats, in ms.
repeat_delay_ms = 800
# The time between repeats, in ms.
repeat_every_ms = 100
# Apps that get text as key presses in their own layout, by file name such as "app.exe"; scrcpy (a phone mirror)
# reads letters only as key presses.
key_apps = ["scrcpy.exe"]
# The most characters a picked word may erase or type; a longer request types nothing.
text_cap = 256
# The pause after each Backspace of a picked word, in ms, so apps that drop fast key bursts take every key.
erase_gap_ms = 10
# Where the user last put the keyboard, in physical pixels; used only when `placed` is true.
x = 0
y = 0
placed = false
# The bottom corner of the keyboard's screen where the minimise bubble goes: "right" or "left".
bubble_corner = "right"
# The shortcuts layer's pages in order, by shortcut id. Ids the platform lacks are skipped, with any page they leave
# empty; a page written empty here is refused.
shortcut_pages = [
    [
        "copy", "paste", "cut", "select-all", "undo", "redo", "copy-all", "cut-all", "delete-all", "find", "save",
        "print", "emoji",
    ],
    [
        "switch-app", "show-desktop", "file-explorer", "lock-pc", "task-manager", "close-window", "new-tab",
        "close-tab", "reopen-tab", "refresh", "zoom-in", "zoom-out",
    ],
    ["f1", "f2", "f3", "f4", "f5", "f6", "f7", "f8", "f9", "f10", "f11", "f12"],
]
