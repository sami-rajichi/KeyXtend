# How the keyboard moves: each animation's length (ms) and curve, from the mock-up's transitions and keyframes.
# Curves are CSS cubic-bezier points [x1, y1, x2, y2]; reduced motion, or Windows' animation effects off, makes every length 0
# except the hold ring's waves, which show the hold's time.

[curves]
ease = [0.25, 0.1, 0.25, 1.0]
ease_out = [0.0, 0.0, 0.58, 1.0]
ease_in_out = [0.42, 0.0, 0.58, 1.0]
linear = [0.0, 0.0, 1.0, 1.0]
# Fast start and a soft landing: the language carousel, the legends and panels (mock-up cubic-bezier(.2,.8,.2,1)).
swift = [0.2, 0.8, 0.2, 1.0]
# Overshoots a little, for the D-pad's Stop (mock-up .dp-stop).
spring = [0.3, 1.5, 0.5, 1.0]
# The hold ring's waves (mock-up .ring.run .w1, .w2) and its core fading in (ease-in).
wave = [0.45, 0.0, 0.55, 1.0]
ease_in = [0.42, 0.0, 1.0, 1.0]

[moves]
# A cap rising after a press, which sinks it at once so the next frame shows it (.cap transform, spec §10), and colours
# changing on keys, lights and the D-pad (.cap, .led, .dp).
press = { ms = 90, curve = "ease" }
colour = { ms = 150, curve = "ease" }
# The plate's colour on a theme or mode change (.kb background).
plate = { ms = 200, curve = "ease" }
# One pulse of a recording key's light, one glow of its cap (.key.rec), and one pulse of the caption's red dot (.rec-dot).
led = { ms = 1000, curve = "ease_in_out" }
glow = { ms = 1400, curve = "ease_in_out" }
dot = { ms = 1000, curve = "ease" }
# After a language change, the language key's names slide in (.car-track) and the legends rise in (.kb-main.swap).
carousel = { ms = 300, curve = "swift" }
legends = { ms = 280, curve = "swift" }
# The D-pad's Stop popping in and out (.dp-stop).
stop = { ms = 220, curve = "spring" }
# The Copy pill, the caption bar and a panel popping in (.selpill, .capbar, .pop).
pill = { ms = 180, curve = "ease_out" }
caption = { ms = 200, curve = "ease_out" }
panel = { ms = 180, curve = "swift" }
# The side block's swap to or from the shortcuts layer: each new cell fades in and rises amount.pop_rise_px into place, as
# a panel pops in (.pop popIn .18s; the mock-up swaps at once).
layer = { ms = 180, curve = "swift" }
# One pass of the shimmer while the words are on their way (.shimmer).
shimmer = { ms = 1000, curve = "linear" }
# The burst when a hold fires (.burst .b-ring, .b-dot).
burst = { ms = 420, curve = "ease_out" }
# The mode badge beside the pointer fading in and out; the mock-up shows it at once, so WinUI's ControlFastAnimationDuration.
badge = { ms = 167, curve = "ease_out" }
# The scroll pad's target outline fading in, and out and back in to move to a new target; the mock-up shows it at once,
# so WinUI's ControlFastAnimationDuration.
outline = { ms = 167, curve = "ease_out" }
# The notice banner dropping in (.toast toastIn, lines 399-401) and the tray menu opening (.ctx ctxIn, lines 360-361).
notice = { ms = 200, curve = "ease_out" }
menu = { ms = 140, curve = "ease_out" }

[amount]
# A pulse dims to this opacity halfway; a recording cap brightens by this factor halfway (.key.rec).
pulse_low = 0.35
glow_lift = 1.12
# Language names slide in from this share of their width; legends rise in from this share of their height.
carousel_shift = 0.28
rise = 0.6
# A pop-in starts this far down (px) and at this scale (@keyframes popIn); the notice drops in from as far up (toastIn).
pop_rise_px = 6.0
pop_scale = 0.98
# The tray menu opens from this scale (@keyframes ctxIn, line 361).
menu_scale = 0.96

[ring]
# The hold ring (mock-up .ring): its waves shrink on wave_curve over the hold less [mouse] ring_after_ms, even with
# reduced motion, and its core fades in on core_curve.
wave_curve = "wave"
core_curve = "ease_in"

[ring.amount]
# A wave's opacity at its start, turn and end, the turn's share of its time, and its end scale (@keyframes shrink).
wave_fade = [0.15, 0.85, 1.0]
wave_turn = 0.55
wave_end = 0.13
# The second wave runs this share of the time, starting once the rest has passed (.ring.run .w2).
wave2_share = 0.8
# The core's starting scale and end opacity (@keyframes core).
core_from = 0.4
core_to = 0.9
# The burst ring's start and end scale, and the dots' end scale (@keyframes burst, fly).
burst_scale = [0.15, 1.25]
dot_end = 0.3
