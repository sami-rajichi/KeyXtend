# The three keyboard themes, each light and soft dark, from design/keyboard-style-lab.html (lines 105-142, 198-217).
# CSS rgba() is written #RRGGBBAA.

# Sizes all themes share are in shape.toml, timings in motion.toml and icons in icons.toml.
# Each palette's dim and dim_ink come from shape.toml [dim], so they are not written here.
# legend_2_plate colours secondary text and icons on the plate; a palette writes it only where it differs from legend_2.

# Where the P1 test build and the mock-up differ, the test build's tokens are the owner's reference.
# The drawn check (src/drawn.rs) keeps all drawn text at WCAG AA where it sits, except the Carousel's faded side names.
# A colour marked "owner 2026-09-30" or "2026-10-02" was nudged just enough to pass it.

# Colours every theme shares, written once in the mock-up: the press shade (.key.down brightness .94), the caption's
# recording dot (.rec-dot), the Copy pill's hover (.selpill button:hover) and the snip overlay (.snip-dim, .snip-rect, .dims).
[common]
press = "#0000000F"
rec_dot = "#E5484D"
pill_hover = "#7F7F7F38"
snip_dim = "#0000006B"
snip_edge = "#FFFFFF"
snip_tag = "#00000099"

[[theme]]
id = "native"
key_radius_px = 4.0
window_radius_px = 8.0
gap_px = 4.0
legend_px = 13.0
mod_legend_px = 11.0
legend_weight = 400
arabic_scale = 1.12
# Windows's own UI font; the mock-up's web fallback Noto Sans (line 106) is not bundled, so it is left out.
latin_fonts = ["Segoe UI Variable Text", "Segoe UI"]
# Its ascent, descent and cap height as shares of its size, as Qt reads them: where its legends sit on a cap.
font_metrics = [1.079, 0.251, 0.7]
arabic_fonts = ["Segoe UI", "Noto Sans Arabic"]
led_glow_px = 5.0
lock_glow_px = 0.0
lock_glow_mix = 0.0
# Native keeps its own blue; it takes the system accent only when [ui] follow_accent is on (spec 3.5).
accent = true

[theme.cap]
kind = "flat"

# The D-pad's colours, as token names (mock-up lines 241-257).
[theme.dpad]
face = "key_act"
ink = "legend_act"
on = "on"
on_ink = "on_ink"
stop = "rec"
stop_ink = "rec_ink"

[theme.light]
# The mock-up's 88% #F3F3F3 frosted plate as it shows over its wallpaper.
plate = "#E9EBEB"
key = "#FFFFFF"
key_mod = "#EBEBEB"
key_act = "#F7F7F7"
enter = "#005FB8"
enter_ink = "#FFFFFF"
danger = "#EBEBEB"
danger_ink = "#1B1B1B"
legend = "#1B1B1B"
legend_mod = "#1B1B1B"
legend_2 = "#5F5F5F"
legend_act = "#1B1B1B"
on = "#005FB8"
on_ink = "#FFFFFF"
lock = "#005FB8"
lock_ink = "#FFFFFF"
rec = "#C42B1C"
rec_ink = "#FFFFFF"
led_off = "#00000000"
led_on = "#005FB8"
ring = "#005FB8"
badge_bg = "#005FB8"
badge_ink = "#FFFFFF"
pop_bg = "#F9F9F9"
pop_ink = "#1B1B1B"
pop_muted = "#5F5F5F"
pop_line = "#00000017"
pop_hover = "#0000000B"
pop_sel = "#DCE9F7"
chip_bg = "#0000000E"
hover = "#0000000F"
key_shadow = [
    { inset = true, x = 0.0, y = -1.0, blur = 0.0, spread = 0.0, color = "#00000024" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#0000000B" },
]
window_shadow = [
    { x = 0.0, y = 12.0, blur = 32.0, spread = 0.0, color = "#00000038" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#00000014" },
]

