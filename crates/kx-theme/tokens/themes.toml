[[theme]]
id = "dolch"
key_radius_px = 5.0
window_radius_px = 10.0
gap_px = 3.0
legend_px = 13.0
mod_legend_px = 10.5
legend_weight = 500
arabic_scale = 1.1
latin_fonts = ["Rubik"]
font_metrics = [0.935, 0.25, 0.7]
arabic_fonts = ["Rubik", "Noto Sans Arabic"]
led_glow_px = 5.0
lock_glow_px = 8.0
lock_glow_mix = 0.55
# Sculpted caps keep their skirt colours, so Dolch never takes the accent.
accent = false

# A sculpted cap: a coloured skirt with a lighter top inset into it; pressed, the top sinks.
[theme.cap]
kind = "skirt"
top = { lighten = 0.12, mid_stop = 0.70, darken = 0.0, upward = false }
top_inset_px = [1.0, 3.0, 4.0, 3.0]
pressed_inset_px = [2.0, 3.0, 2.0, 3.0]
top_radius_px = 4.0
legend_lift_px = 1.5
# A label may run this far past the top onto the skirt, each side (P1's AltGr does); longer words shrink to fit.
label_spill_px = 1.0

# The D-pad's colours, as token names: Dolch's arrows use the modifier grey (mock-up line 245).
[theme.dpad]
face = "key_mod"
ink = "legend_act"
on = "on"
on_ink = "on_ink"
stop = "rec"
stop_ink = "rec_ink"

