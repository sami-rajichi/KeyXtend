# Sizes all three themes share, from the mock-up's CSS (design/keyboard-style-lab.html), in pixels at size 1 unless a section says
# otherwise.
# Lists follow the order their comment gives.
[bar]
# Top-bar buttons: width and height, icon, S/M/L text with its weight unlit (mock-up .tb) and lit, radius as a share of the key
# radius, gap.
button_px = [24.0, 22.0]
icon_px = 14.0
label_px = 11.0
weight = 400
lit_weight = 600
radius_share = 0.8
gap_px = 4.0
# The lit size's mark in the ring colour under its letter, as Windows 11 marks a selected tab with a pill: width, height and
# gap above the button's bottom.
mark_px = [10.0, 2.0, 2.0]

[chip]
# Suggestion chips: height, side padding, text size (Latin, Arabic), weight, icon size, icon gap.
height_px = 20.0
pad_px = 9.0
font_px = [11.5, 12.5]
weight = 500
icon_px = 11.0
gap_px = 4.0

[legend]
# Corner legends: sizes as shares of the main one (second, third), distance in from the face the theme draws (top,
# bottom, side), weight. Small and tucked into their corner, so they leave the main legend clear (owner 2026-10-10);
# 2.5 px at the top keeps ET66's secondary capitals at 4.5:1 near its convex cap's top (the drawn check's span).
corner_scale = [0.496, 0.48]
corner_px = [2.5, 1.5, 3.0]
corner_weight = 400
# Icons (main keys, side keys) and the gap to a text beside them.
icon_px = [14.0, 15.0]
gap_px = 4.0
# Space bar text size (Latin, Arabic) and side padding.
space_px = [10.5, 11.5]
space_pad_px = 6.0
# Named-key labels shrink to fit their cap, like real keycaps: the side padding, and the smallest size in Qt units
# (French keys print longer words such as "Échap").
label_pad_px = 1.0
label_min_px = 7.0

[led]
# The LED dot: diameter, and distance from the cap's top and right edges.
size_px = 4.0
inset_px = 3.0

[lang]
# Language carousel: gap, side names (size, opacity) and their weight (mock-up .car-it), current name (Latin size, Arabic size),
# weight; a click on the left third goes back a layout. The Cycle and List designs show the current name the same way, with
# icon_gap_px between their icon, name and dots (mock-up .lk, line 219).
gap_px = 5.0
side = [9.0, 0.45]
side_weight = 400
font_px = [12.5, 14.0]
weight = 600
back_share = 0.3333
icon_gap_px = 3.0

[lang.cycle]
# The Cycle design (mock-up .cyc, lines 230-231): globe icon size and opacity; its dots are [dots].
icon_px = 12.0
icon_share = 0.75

[lang.list]
# The List design (mock-up .lst, lines 237-238): the chevron's size and opacity beside the current name.
icon_px = 11.0
icon_share = 0.7

[dots]
# One dot per layout on the Cycle design and per page under the shortcuts layer's Next key (mock-up .dots, lines 233-235):
# diameter, the lit dot's diameter, gap, and an unlit dot's opacity; the lit dot is opaque.
px = 3.0
# An unlit dot keeps 3:1, so the lit one stands out by size instead (mock-up .dots i.on is opaque only).
on_px = 4.5
gap_px = 2.0
# 2026-10-02: an unlit dot still counts the layouts or pages, so it keeps 3:1 where it sits on every cap (mock-up .3).
off = 0.72
# Where the Next key's dots start in its chevron's box, as a share of it: two units under chevron-right's ink, which
# ends at 19 of its 24 units, so the chevron sits as every side icon does and the larger lit dot clears it.
next_at = 0.875

[dpad]
# D-pad: gap between arrows, arrow icon, where each arrow sits across the ring from the hub's edge (0) to the pad's edge (1),
# hub and Stop insets (shares of the pad, each below 0.5 or no disc is left, Stop's at least the hub's so it sits inside),
# Stop icon; the grid's 45 degree turn is set in code.
# A reach of 0.5 centres each arrow in its quarter, as the iPod click wheel's labels (owner, 2026-10-16).
gap_px = 2.0
icon_px = 15.0
reach = 0.5
hub = 0.34
stop = 0.36
stop_icon_px = 10.0
# Stop's speed dots under its icon, one lit for slow and both for fast (mock-up .lv): diameter and gap as .lv i, and an unlit
# dot's opacity, raised from the mock-up's .25 so its place shows while a lit dot keeps 3:1 against it in every palette.
dot_px = 3.0
dot_gap_px = 2.0
dot_off = 0.3

[press]
# A pressed cap sinks and shrinks (the theme's `press` colour darkens it); the ring while moving or resizing.
sink_px = 1.0
scale = 0.97
ring_px = 2.0

[tip]
# Tooltips with a button's name (WinUI ToolTip: 12 px text, 9/6 px padding): text size and weight,
# padding (top and bottom, sides), radius, and gap to the button.
font_px = 12.0
weight = 400
pad_px = [6.0, 9.0]
radius_px = 4.0
gap_px = 6.0

[line]
# Hairlines in pop_line (mock-up 1px borders): panel and tooltip edges, the corner's rim, dividers; not scaled.
px = 1.0

[dim]
# A key that comes in a later version shows at this opacity over the plate (mock-up .btn[disabled], line 302); every
# palette's dim and dim_ink colours come from it.
share = 0.4

[hc_outline]
# In high contrast a key under the pointer gets an inner outline this wide in Highlight, since a tint is not a system
# colour (mock-up .scroll-target outline, line 83); not scaled.
px = 2.0

[outline]
# The scroll pad's target outline, inside its box in the ring colour (Highlight in high contrast; mock-up .scroll-target, line
# 83); not scaled.
px = 2.0

[backdrop]
# Over a system backdrop ([ui] backdrop, Mica or Acrylic) the plate keeps this share of its colour, so the material shows
# through (the P1 test build's plate_alpha).
plate = 0.88

[pill]
# The Copy pill (mock-up .selpill): padding, button side padding, text size and weight, icon size and icon-to-text gap;
# its height is tools.pill_px.
pad_px = 3.0
button_side_px = 11.0
font_px = 12.0
weight = 600
icon_px = 13.0
gap_px = 5.0

[caption]
# The caption bar (mock-up .capbar): status padding (top and bottom, left, right), padding around words (.done),
# dot-to-status gap (.st), status text size and weight, words size (Latin, Arabic), recording dot, icon size (.i),
# status bar height (6 + the 26 px wave + 6), radius around words (.done).
pad_px = [6.0, 14.0, 8.0]
words_pad_px = 10.0
gap_px = 6.0
status_px = 12.5
status_weight = 600
words_px = [14.0, 15.0]
dot_px = 8.0
icon_px = 15.0
bar_px = 38.0
words_radius_px = 14.0
# The shimmer while the words are on their way (.shimmer): height and radius, and how many bar widths its band spans.
shimmer_px = [10.0, 6.0]
shimmer_span = 2.0

[snip]
# The snip overlay (mock-up .snip-rect .dims, .snip-bar, .hintx): size tag text size, weight, padding, radius and
# gap above the region; hint bar gap from the top, padding (3 around 28 px buttons, here text only), radius, text size.
tag_px = 11.0
tag_weight = 500
tag_pad_px = [2.0, 6.0]
tag_radius_px = 4.0
tag_gap_px = 22.0
bar_top_px = 10.0
bar_pad_px = [8.0, 9.0]
bar_radius_px = 9.0
hint_px = 11.0

[panel]
# The Arabic test panel (mock-up .pop, .clip width): width, radius share of the window radius, header padding (top, end,
# bottom, start) and gap, title size and weight, icon buttons (.ib: side, radius, icon, also the header's icon), list padding
# (top, sides, bottom), list-to-pager gap.
width_px = 480.0
radius_share = 0.9
head_pad_px = [7.0, 8.0, 7.0, 12.0]
head_gap_px = 8.0
title_px = 13.0
title_weight = 600
button_px = [28.0, 6.0, 15.0]
body_pad_px = [4.0, 8.0, 8.0]
body_gap_px = 6.0
# Rows (.lrow: height, gap, side padding, radius) and their text (Latin, Arabic); page buttons (.pg: width, height, radius, icon),
# pager gap, a page button's opacity when it cannot be used, page number (.pgn) size and weight, footer padding (.lfoot).
row_px = [46.0, 2.0, 8.0, 8.0]
row_text_px = [12.5, 14.0]
page_px = [38.0, 46.0, 9.0, 18.0]
pager_gap_px = 4.0
off_share = 0.35
count_px = 11.0
count_weight = 600
foot_pad_px = [7.0, 12.0]
# The text field is not in the mock-up: height, radius (.btn), side padding, text size (.field). The panel sits gap_px[0] above
# the keyboard, or below it when there is no room, and at least gap_px[1] inside the screen (placePop).
field_px = [34.0, 7.0, 10.0, 14.5]
gap_px = [10.0, 8.0]

[notice]
# The notice banner, which grows with the keyboard and sits panel.gap_px[0] above it (mock-up .toast, lines 398-400):
# padding (top and bottom, sides), gap between icon, text and buttons, text size, icon size, and corner radius as a share
# of the window radius (.pop, line 289); then its buttons (.btn, line 301): padding, radius, text size and weight.
pad_px = [7.0, 14.0]
gap_px = 7.0
font_px = 12.5
icon_px = 14.0
radius_share = 0.9
button_pad_px = [6.0, 11.0]
button_radius_px = 7.0
button_px = 12.0
button_weight = 600

[menu]
# The tray menu (mock-up .ctx, lines 359-365), not scaled with the keyboard: least width, padding, corner radius, text size;
# items: padding (top and bottom, sides), radius, gap to the icon, icon size and opacity; the rule between items: margin
# (top and bottom, sides).
width_px = 200.0
pad_px = 4.0
radius_px = 8.0
font_px = 13.0
item_pad_px = [7.0, 10.0]
item_radius_px = 5.0
gap_px = 10.0
icon_px = 15.0
icon_share = 0.8
rule_px = [4.0, 2.0]

[list]
# The language list panel, which grows with the keyboard and pages with the panel's page buttons (mock-up .langs and .lg-it,
# lines 350-357): width, padding; rows: padding (top and bottom, sides), radius, gap; the short-name badge: width, height,
# radius, text size (Latin, Arabic), weight; the name's size, the layout's size under it, and the current row's icon size.
width_px = 220.0
pad_px = 5.0
row_pad_px = [7.0, 8.0]
row_radius_px = 7.0
gap_px = 10.0
badge_px = [28.0, 22.0, 5.0]
badge_text_px = [12.0, 14.0]
badge_weight = 600
name_px = 12.5
sub_px = 10.5
icon_px = 14.0

[tray]
# The tray icon's drawing (not in the mock-up): the badge's corner radius and the glyph's size, as shares of the icon's
# side. The badge takes the theme's badge colours, so the icon reads on a light or a dark taskbar.
radius_share = 0.22
glyph_share = 0.75

[ring]
# The hold ring around the pointer (mock-up .ring, .burst), not scaled with the keyboard: side of the ring and its window,
# wave borders (first, second), the core's share of the side, burst ring (side, border), burst dots (side, count), and how far
# from the centre the dots start and end.
box_px = 76.0
wave_px = [2.5, 1.5]
core_share = 0.1
burst_px = [60.0, 2.0]
dot_px = 6.0
dots = 6
fly_px = [6.0, 30.0]

[badge]
# The mode badge beside the pointer (mock-up .badge), not scaled with the keyboard: padding (top and bottom, sides), icon
# size, icon-to-text gap, text size and weight. It is a pill (border-radius: 999px), so QML rounds it by half its height.
pad_px = [3.0, 7.0]
icon_px = 13.0
gap_px = 4.0
font_px = 10.5
weight = 600
# Where it sits from the pointer's tip, right and down (mock-up updateBadge), and the least gap it keeps to a screen
# edge (placePop's, as the panel keeps).
offset_px = [16.0, 18.0]
edge_px = 8.0
# The dot between the mode part and the scroll part (mock-up updateBadge's · at opacity .4): diameter, about a 10.5 px middle
# dot, and opacity.
sep_px = 2.0
sep_share = 0.4

[extra]
# The resize corner (diameter, icon; not in the mock-up), the bubble (diameter, icon, inset from the screen corner; mock-up .kb-bubble),
# and the test strip (height, gap above, padding, text size).
corner_px = [20.0, 12.0]
bubble_px = [46.0, 20.0, 12.0]
strip_px = [28.0, 6.0, 8.0, 12.0]

[clip]
# The clipboard panel (spec §7; mock-up .clip and buildClip, lines 312-341 and 1563-1577) on [panel]'s frame, header,
# rows, pager, footer padding and search field: the kept line's size (.sm) and the empty line's icon (.locked-box .i).
kept_px = 11.0
empty_px = 30.0
# The search line, not in the mock-up: its icon, the caret's width, and the ring-coloured line under it that shows where
# letters go, as WinUI's focused TextBox draws its 2 px accent line.
search_icon_px = 15.0
caret_px = 2.0
underline_px = 2.0
# The filters (.filters: padding top, sides, bottom; gap) and a chip (.fl): height, side padding, the shown one's check
# icon and its gap; its text is [chip]'s. 28 px high, over the mock-up's 21, so each is a big target (WCAG 2.5.8).
filters_pad_px = [8.0, 10.0, 4.0]
filter_gap_px = 4.0
filter_px = [28.0, 12.0, 12.0, 5.0]
# A row (.lrow): the gap between its parts and its least padding top and bottom; the tick box (.ck: side, radius, border,
# number size) and its number's weight; the thumbnail tile (.th2: width, height, radius, icon) and the picture's inset;
# the meta line (.tt .m: size, gap above); the pin (.pin .i); the expires chip (.exp: text size, padding top and bottom,
# sides), 11 px over the mock-up's 10 so it reads.
row_gap_px = 9.0
row_pad_px = 4.0
tick_px = [22.0, 6.0, 1.5, 11.0]
tick_weight = 600
thumb_px = [46.0, 34.0, 6.0, 17.0]
thumb_inset_px = 2.0
meta_px = [10.5, 1.0]
pin_px = 13.0
expires_px = [11.0, 2.0, 8.0]
# Buttons (.btn): height, radius, side padding, text size, icon, icon gap, and the text's weight; 32 px high so each is a
# big target. The gap between the footer's buttons (.lfoot).
button_px = [32.0, 7.0, 11.0, 12.0, 14.0, 6.0]
button_weight = 600
foot_gap_px = 8.0
# The note band under the header (padding, radius, text size), the storage line (padding top and bottom, text size, icon)
# and the preview's text size (Latin, Arabic).
note_px = [7.0, 8.0, 12.0]
room_px = [6.0, 11.0, 13.0]
preview_px = [13.0, 14.5]
