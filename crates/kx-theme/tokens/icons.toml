# The icon each part shows, by file name without ".svg": Lucide icons are in assets/icons/lucide/, our own drawings in
# assets/icons/ (design/keyboard-style-lab.html keyInner, sideKey, topBar and langInner, lines 958-1006).
# A name is lower-case letters, digits and "-"; keys not listed here show a translated text label.

# Named keys by their board.toml id, then the side keys; the Windows key shows our own drawing of its logo.
[keys]
bksp = "delete"
tab = "arrow-right-to-line"
enter = "corner-down-left"
shift = "arrow-big-up"
rshift = "arrow-big-up"
up = "chevron-up"
menu = "square-menu"
win = "win-logo"
left = "chevron-left"
down = "chevron-down"
right = "chevron-right"
rclick = "mouse-right"
grab = "hand-grab"
shortcuts = "command"
mic = "mic"
clip = "clipboard-clock"
snip = "scissors-line-dashed"
fill = "key-round"
settings = "settings-2"
power = "power"

# The shortcuts layer's keys by shortcut id (owner, 2026-10-23; mock-up sideShortcuts); F1 to F12 show their name.
[shortcuts]
# Copy, Paste, Cut and Select all.
copy = "copy"
paste = "clipboard-paste"
cut = "scissors"
select-all = "text-select"
# Undo and Redo.
undo = "undo-2"
redo = "redo-2"
# The chains: Select all then Copy, Cut or Delete.
copy-all = "clipboard-copy"
cut-all = "square-scissors"
delete-all = "eraser"
# Find, Save, Print and the emoji panel.
find = "search"
save = "save"
print = "printer"
emoji = "smile"
# Switch app keeps the system switcher open; Show desktop and File Explorer.
switch-app = "arrow-left-right"
show-desktop = "monitor-down"
file-explorer = "folder-open"
# Lock PC, Task Manager and Close window.
lock-pc = "lock"
task-manager = "activity"
close-window = "square-x"
# Tabs: new, close and reopen the last closed one.
new-tab = "plus"
close-tab = "x"
reopen-tab = "history"
# Refresh, and zoom in and out.
refresh = "refresh-cw"
zoom-in = "a-arrow-up"
zoom-out = "a-arrow-down"

# The shortcuts layer's Next key: a chevron, with one dot per page under it.
[layer]
next = "chevron-right"

# The top bar: move, the light or dark switch (mode_on while dark), the theme button, the size lenses, minimise (the
# plain minus, as Windows draws it) and close; then the resize corner and the bubble.
[bar]
grip = "grip-horizontal"
mode = "moon"
mode_on = "sun"
theme = "palette"
smaller = "zoom-out"
bigger = "zoom-in"
minimise = "minus"
close = "x"
corner = "move-diagonal-2"
bubble = "keyboard"

# The D-pad's arrows and its Stop button (mock-up lines 241-259).
[dpad]
up = "chevron-up"
right = "chevron-right"
left = "chevron-left"
down = "chevron-down"
stop = "square"

# The language key's Cycle design shows a globe, and its List design a chevron that opens the list (langInner); the list
# ticks its current row (.lg-it .i, lines 357 and 1548).
[lang]
cycle = "globe"
list = "chevron-up"
current = "check"

# Paged lists' page buttons (mock-up pagerHTML, line 1562): back a page and on a page.
[page]
back = "chevron-up"
on = "chevron-down"

# The notice banner's icon (mock-up .toast .i, line 400): the keyboard, since every notice is about it.
[notice]
icon = "keyboard"

# The tray: the drawing on its icon, and its menu's items (mock-up .ctx .i, line 364): Show keyboard, Dictation as the
# Dictation key shows it, and Quit.
[tray]
glyph = "keyboard"
show = "keyboard"
voice = "mic"
quit = "power"

# The selection strip's keycaps (design/selection-chips.html design 4, I): Copy, Cut and Paste as on the shortcuts
# layer, Translate, and the tick a clicked keycap shows with its done word.
[chips]
copy = "copy"
cut = "scissors"
paste = "clipboard-paste"
translate = "languages"
tick = "check"

# The chip lane (spec §6; mock-up suggHTML, line 1042): the chip kinds as the lane names them (domain, email, saved,
# more, undo), the password note's lock and its Quick-fill chip (the fill key's key-round, as a saved email), the menu
# button, and the menu's items, whose forget mark each chip wears in forget mode.
[words]
domain = "at-sign"
email = "at-sign"
saved = "key-round"
more = "chevron-right"
undo = "undo-2"
locked = "lock"
fill = "key-round"
menu = "square-menu"
forget = "eraser"
pause = "eye-off"
resume = "eye"
power = "power"
cancel = "x"

# The clipboard panel (spec §7; mock-up buildClip and TYPEICON, lines 877 and 1563): its title, which the empty line
# shares, the search line and Close; each row kind's icon by the hub's kind id (a file shows the plain file);
# the pin, the footer's actions, No's cancel, the shown filter's check, the storage line, Open folder and Back.
[clip]
title = "clipboard-clock"
search = "search"
close = "x"
kind_text = "file-text"
kind_link = "link"
kind_image = "image"
kind_file = "file"
kind_media = "film"
pin = "pin"
unpin = "pin-off"
preview = "eye"
delete = "trash-2"
insert = "clipboard-paste"
cancel = "x"
shown = "check"
room = "hard-drive"
folder = "folder-open"
back = "arrow-left"

# Quick-fill (design "The panel"; mock-up buildFill, lines 1597-1612): its title, which the empty notebook's invitation
# shares, the search line and the header's New, Backup and Close; the pages' Back, Edit, Save, Cancel, Delete entry,
# Add a field and Your own label, and the shown filter's check; each kind's icon by the vault's kind id and a label's
# tag; the row buttons by id (Both types a Tab, so it wears the Tab key's icon); the field buttons, the hidden switch
# as a tick box, and the footer's waiting line.
[fill]
title = "key-round"
search = "search"
new = "plus"
backup = "archive"
close = "x"
back = "arrow-left"
edit = "text-select"
save = "check"
cancel = "x"
delete = "trash-2"
add_field = "plus"
own_label = "tag"
shown = "check"
kind_person = "user"
kind_login = "globe"
kind_wifi = "wifi"
kind_card = "id-card"
kind_note = "sticky-note"
kind_other = "key-round"
label = "tag"
user = "user"
password = "key-round"
both = "arrow-right-to-line"
insert = "clipboard-paste"
open = "chevron-right"
show = "eye"
hide = "eye-off"
hidden_on = "check"
hidden_off = "square"
paste = "clipboard-paste"
make = "wand-sparkles"
waiting = "archive"
# The backup and import pages (design "The backup box" and "Import"): Remove, as the opposite of Add place, and Choose;
# each place by its kind; the Backup page's buttons and its memory checks switch, a tick box as the hidden switch is;
# Another folder, Use this folder and Done; and the password page's lock.
remove = "minus"
pick = "check"
place_cloud = "cloud"
place_removable = "usb"
place_drive = "hard-drive"
place_folder = "folder"
place_file = "file-input"
back_up_now = "archive"
add_place = "plus"
change_password = "key-round"
checks_on = "check"
checks_off = "square"
bring_back = "history"
keepass = "file-input"
other_folder = "folder-open"
here = "check"
done = "check"
lock = "lock"

# The dictation bar (design/voice-bar.html bar(), lines 279-298): each button by the hub's id (Listen again as the
# Dictation key, Copy turning to its tick once copied, Open service as a page, or a key on the key note), the gear, the
# mark before Transcribing, a text and a password box's dots, and before each note by its hint id; a note not listed
# wears `note`.
[voice]
cancel = "x"
stop = "square"
gear = "settings-2"
close = "x"
copy = "copy"
copied = "check"
undo = "undo-2"
anyway = "rotate-ccw"
again = "rotate-ccw"
listen = "mic"
download = "download"
service = "file"
service_key = "key-round"
local = "cpu"
cloud = "cloud"
transcribing = "audio-lines"
text = "captions"
password = "lock"
note = "square-x"

# The microphone's faults show it off, a model's room its drive, a language its languages, the memory the processor,
# and a download's faults their own mark.
[voice.notes]
cancelled = "x"
nothing = "mic-off"
no-mic = "mic-off"
mic-busy = "mic-off"
mic-refused = "mic-off"
unplugged = "mic-off"
no-model = "hard-drive"
language = "languages"
no-language = "languages"
checking = "refresh-cw"
no-fit = "cpu"
print = "download"
taken = "file"
full = "hard-drive"
folder = "folder"
net = "wifi"

# The Voice panel (design/voice-bar.html PAGE, lines 301-393): the folder line, a stepper's minus and plus, a place's
# chevrons, a pinned text, the tick where one row is picked, Unpin, the slow-PC and untested lines, a folder row; each
# page's header icon (also a home row's tile), each button by the hub's id or its kind (Start reading is `compare`),
# each mark, line above a list and Device kind by id. An id left out shows no icon, as Default and Waiting in the
# mock-up.
[voice.panel]
room = "hard-drive"
minus = "minus"
plus = "plus"
before = "chevron-left"
after = "chevron-right"
pinned = "pin"
ticked = "check"
unpin = "pin-off"
slow = "cpu"
untested = "languages"
folder = "folder"

[voice.panel.pages]
home = "mic"
models = "audio-lines"
device = "cpu"
compare = "scale"
history = "history"
options = "settings-2"
folders = "folder-open"
cloud = "cloud"
card = "file-text"
service = "key-round"

[voice.panel.buttons]
back = "arrow-left"
close = "x"
use = "check"
download = "download"
delete = "trash-2"
check = "activity"
again = "rotate-ccw"
rerun = "rotate-ccw"
insert = "clipboard-paste"
copy = "copy"
pin = "pin"
delete-all = "trash-2"
cancel = "x"
change = "folder"
open = "folder-open"
here = "check"
compare = "mic"
pause = "pause"
resume = "play"
on = "power"
off = "power"
facts = "file-text"
lines = "key-round"
paste = "clipboard-paste"
test = "activity"
remove = "trash-2"
link = "link"

[voice.panel.marks]
used = "check"
ready = "check"
download = "download"
not-here = "x"
other = "file"
passed = "check"
failed = "x"
done = "check"
run-failed = "x"
off = "power"
needs-key = "key-round"
needs-address = "globe"
on = "check"
untested = "activity"
unavailable = "x"
cloud = "cloud"

[voice.panel.tops]
best = "check"
failed = "x"
step = "scale"
kept = "check"

[voice.panel.kinds]
auto = "arrow-left-right"
cpu = "cpu"
card = "gpu"
built-in = "gpu"

# The cloud pages (design/voice-cloud.js): the switch band, the line while cloud is off, the day facts were read, the
# Untested line, where keys are made, and a key test's answers by their id; a warning shows no icon of its own.
[voice.panel.cloud]
switch = "cloud"
off = "power"
read = "history"
untested = "activity"
site = "key-round"
ok = "check"
testing = "activity"
no-test = "activity"
