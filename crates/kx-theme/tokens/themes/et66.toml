# The ET66 theme, light and soft dark; the notes for every theme are in common.toml.

[[theme]]
id = "et66"
key_radius_px = 9.0
window_radius_px = 14.0
gap_px = 5.0
legend_px = 13.0
mod_legend_px = 10.5
legend_weight = 500
arabic_scale = 1.14
latin_fonts = ["IBM Plex Sans"]
font_metrics = [1.025, 0.275, 0.698]
arabic_fonts = ["IBM Plex Sans Arabic", "Noto Sans Arabic"]
led_glow_px = 5.0
lock_glow_px = 0.0
lock_glow_mix = 0.0
# ET66 marks function with its own colours, so it never takes the accent.
accent = false

# A convex cap: lighter at the top, darker at the bottom; pressed, the gradient flips.
[theme.cap]
kind = "convex"
rest = { lighten = 0.07, mid_stop = 0.55, darken = 0.07, upward = false }
pressed = { lighten = 0.05, mid_stop = 0.50, darken = 0.08, upward = true }

# The D-pad's colours, as token names: ET66 lights its arrow and Stop in the Enter yellow (mock-up lines 253 and 257).
[theme.dpad]
face = "key_act"
ink = "legend_act"
on = "enter"
on_ink = "enter_ink"
stop = "enter"
stop_ink = "enter_ink"

[theme.light]
plate = "#E4E1DA"
key = "#F8F6F1"
key_mod = "#CDBBA7"
key_act = "#F8F6F1"
enter = "#F2C400"
enter_ink = "#1D1B18"
danger = "#CDBBA7"
danger_ink = "#1D1B18"
legend = "#1D1B18"
legend_mod = "#1D1B18"
legend_2 = "#5D5850"  # 2026-10-11: AA under the press shade (was #666057, first #6B655C)
legend_2_plate = "#69635B"  # owner 2026-09-30: nudged to AA on the plate (was #6B655C)
legend_act = "#1D1B18"
on = "#FFFFFF"
on_ink = "#795D00"  # 2026-10-11: AA under the press shade (was #7A5E00)
lock = "#B39C83"
lock_ink = "#1D1B18"
rec = "#FFFFFF"
rec_ink = "#795D00"  # 2026-10-11: AA under the press shade (was #7A5E00)
rec_light = "#C42B1C"  # the video ways' red light (Snip): Fluent's Critical red, as ET66 has none
prep = "#E58A2E"  # the Preparing light, design/voice-bar.html line 98
prep_ink = "#1D1B18"
warn = "#F7E6C4"  # the warning pair, design/voice-bar.html line 98
