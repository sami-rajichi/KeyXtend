key_shadow = [
    { x = 0.0, y = 1.0, blur = 0.0, spread = 0.0, color = "#3C322847" },
    { inset = true, x = 0.0, y = 1.0, blur = 0.0, spread = 0.0, color = "#FFFFFFBF" },
]
window_shadow = [
    { x = 0.0, y = 14.0, blur = 34.0, spread = 0.0, color = "#281E1440" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#0000000F" },
]

