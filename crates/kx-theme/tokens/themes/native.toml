# The Native Adaptive theme, light and soft dark; the notes for every theme are in common.toml.

[[theme]]
id = "native"
key_radius_px = 4.0
window_radius_px = 8.0
gap_px = 4.0
legend_px = 13.0
mod_legend_px = 11.0
legend_weight = 400
arabic_scale = 1.12
# Windows's own UI font; the mock-up's web fallback Noto Sans (line 106) is not bundled, so it is left out.
latin_fonts = ["Segoe UI Variable Text", "Segoe UI"]
# Its ascent, descent and cap height as shares of its size, as Qt reads them: where its legends sit on a cap.
font_metrics = [1.079, 0.251, 0.7]
arabic_fonts = ["Segoe UI", "Noto Sans Arabic"]
led_glow_px = 5.0
lock_glow_px = 0.0
lock_glow_mix = 0.0
# Native keeps its own blue; it takes the system accent only when [ui] follow_accent is on (spec 3.5).
accent = true

[theme.cap]
kind = "flat"

# The D-pad's colours, as token names (mock-up lines 241-257).
[theme.dpad]
face = "key_act"
ink = "legend_act"
on = "on"
on_ink = "on_ink"
stop = "rec"
stop_ink = "rec_ink"

[theme.light]
# The mock-up's 88% #F3F3F3 frosted plate as it shows over its wallpaper.
plate = "#E9EBEB"
key = "#FFFFFF"
key_mod = "#EBEBEB"
key_act = "#F7F7F7"
enter = "#005FB8"
enter_ink = "#FFFFFF"
danger = "#EBEBEB"
danger_ink = "#1B1B1B"
legend = "#1B1B1B"
legend_mod = "#1B1B1B"
legend_2 = "#5F5F5F"
legend_act = "#1B1B1B"
on = "#005FB8"
on_ink = "#FFFFFF"
lock = "#005FB8"
lock_ink = "#FFFFFF"
rec = "#C42B1C"
rec_ink = "#FFFFFF"
prep = "#FFB900"  # the Preparing light: the Windows accent palette's Gold, design/voice-bar.html line 86
prep_ink = "#1B1B1B"
led_off = "#00000000"
led_on = "#005FB8"
ring = "#005FB8"
badge_bg = "#005FB8"
badge_ink = "#FFFFFF"
pop_bg = "#F9F9F9"
pop_ink = "#1B1B1B"
pop_muted = "#5F5F5F"
pop_line = "#00000017"
pop_hover = "#0000000B"
pop_sel = "#DCE9F7"
chip_bg = "#0000000E"
hover = "#0000000F"
key_shadow = [
    { inset = true, x = 0.0, y = -1.0, blur = 0.0, spread = 0.0, color = "#00000024" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#0000000B" },
]
window_shadow = [
    { x = 0.0, y = 12.0, blur = 32.0, spread = 0.0, color = "#00000038" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#00000014" },
]

[theme.dark]
plate = "#2C2F33"
key = "#3B3E43"
key_mod = "#34373C"
key_act = "#373A3F"
enter = "#7CB7F0"
enter_ink = "#10202E"
danger = "#34373C"
danger_ink = "#E3E5E8"
legend = "#E3E5E8"
legend_mod = "#E3E5E8"
legend_2 = "#BABEC3"  # 2026-10-02: AA where it sits, under the hover (was #A9AEB5)
legend_act = "#E3E5E8"
on = "#7CB7F0"
on_ink = "#10202E"
lock = "#7CB7F0"
lock_ink = "#10202E"
rec = "#E8848F"
rec_ink = "#2A0E12"
prep = "#F2B84B"  # the Preparing light, design/voice-bar.html line 91
prep_ink = "#2B1D04"
led_off = "#00000000"
led_on = "#7CB7F0"
ring = "#7CB7F0"
badge_bg = "#7CB7F0"
badge_ink = "#10202E"
pop_bg = "#33363B"
pop_ink = "#E3E5E8"
pop_muted = "#A9AEB5"
pop_line = "#FFFFFF17"
pop_hover = "#FFFFFF0E"
pop_sel = "#2E4760"
chip_bg = "#FFFFFF12"
hover = "#FFFFFF14"
key_shadow = [
    { inset = true, x = 0.0, y = -1.0, blur = 0.0, spread = 0.0, color = "#00000047" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#FFFFFF0A" },
]
window_shadow = [
    { x = 0.0, y = 14.0, blur = 34.0, spread = 0.0, color = "#00000066" },
    { x = 0.0, y = 0.0, blur = 0.0, spread = 1.0, color = "#FFFFFF0F" },
]
