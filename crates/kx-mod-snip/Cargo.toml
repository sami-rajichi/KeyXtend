[package]
name = "kx-mod-snip"
description = "Snip and screen recording: pictures and short videos of a part, a window or the screen, and the [snip] settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The snip ports and events, the capture's shared ranges and the settings contract.
kx-module-api = { path = "../kx-module-api" }
# The settings, and the values the Snip panel and the editor's place write back.
serde.workspace = true
toml.workspace = true
# Error kinds only, never a picture, a video, a path or a typed text.
tracing.workspace = true

[dev-dependencies]
# The snip ports' fakes and the clock, for the flow, actor and module tests.
kx-platform-fake = { path = "../kx-platform-fake" }
# The kernel's settings repair, for the bad-value tests.
kx-settings = { path = "../kx-settings" }
kx-test-support = { path = "../kx-test-support" }
proptest.workspace = true
