[package]
name = "keyxtend-worker"
description = "KeyXtend's worker program: it decodes untrusted images, reads backup boxes and KeePass files, and records the microphone outside the uiAccess keyboard (ADR-0004, ADR-0042)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["engine"]
# The speech engine, with its processor parts as files beside the worker (ADR-0044); CI's Linux lint builds without it.
engine = ["dep:transcribe-cpp", "transcribe-cpp/dynamic-backends"]
# The graphics-card part (Vulkan), on in staged builds; building it needs the Vulkan SDK.
card = ["engine", "transcribe-cpp/vulkan"]
# A sound file in place of the microphone, for the gates only; the stage refuses a worker built with it.
gate = []

[dependencies]
kx-ipc = { path = "../../crates/kx-ipc" }
png.workspace = true
age.workspace = true
keepass.workspace = true
thiserror.workspace = true
zeroize.workspace = true
transcribe-cpp = { workspace = true, optional = true }

# The voice job's microphone; other systems build without it until P15, as Linux needs ALSA's headers for it.
[target.'cfg(windows)'.dependencies]
cpal.workspace = true

# The manifest that runs the worker as its caller, never with uiAccess.
[build-dependencies]
embed-manifest.workspace = true

[dev-dependencies]
proptest.workspace = true
# KeePass test files are written at test time; the feature adds no crate.
keepass = { workspace = true, features = ["save_kdbx4"] }
