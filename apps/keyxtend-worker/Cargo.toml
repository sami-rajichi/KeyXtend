[package]
name = "keyxtend-worker"
description = "KeyXtend's worker program: it decodes untrusted images, reads backup boxes and KeePass files, records the microphone, downloads model files and sends dictations to a cloud service outside the uiAccess keyboard (ADR-0004, ADR-0042, ADR-0047)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["engine"]
# The speech engine, with its processor parts as files beside the worker (ADR-0044); CI's Linux lint builds without it.
engine = ["dep:transcribe-cpp", "transcribe-cpp/dynamic-backends"]
# The graphics-card part (Vulkan), on in staged builds; building it needs the Vulkan SDK.
card = ["engine", "transcribe-cpp/vulkan"]
# A sound file in place of the microphone, for the gates only; the stage refuses a worker built with it.
gate = []

[dependencies]
kx-ipc = { path = "../../crates/kx-ipc" }
png.workspace = true
age.workspace = true
keepass.workspace = true
thiserror.workspace = true
zeroize.workspace = true
transcribe-cpp = { workspace = true, optional = true }
# The fetch job's HTTPS downloads and the speech job's calls, with their address, redirect, range and header rules
# (ADR-0042, ADR-0043 decision 8, ADR-0047).
kx-platform-net = { path = "../../crates/kx-platform-net" }
# The fetch job's SHA-256 check and the speech job's form boundary: the same release `keepass` already builds into
# this program, so no new crate.
sha2 = { version = "0.11.1", default-features = false }
# The speech job reads a service's JSON reply (ADR-0047): `serde_json` 1.0.151, checked on 2026-11-17 and already in
# the app, with `serde`, its own dependency.
serde.workspace = true
serde_json.workspace = true
# Gemini's request writes the sound as Base64 (ADR-0047): `base64` 0.23.1, checked on 2026-11-20, the release
# `keepass` already builds into this program with the same features, so no new crate.
base64 = "0.23.1"

# The voice job's microphone; other systems build without it until P15, as Linux needs ALSA's headers for it.
[target.'cfg(windows)'.dependencies]
cpal.workspace = true

# The manifest that runs the worker as its caller, never with uiAccess.
[build-dependencies]
embed-manifest.workspace = true

[dev-dependencies]
proptest.workspace = true
# The root manifest's stage and tidy settings, which the root tests read.
toml.workspace = true
# KeePass test files are written at test time; the feature adds no crate.
keepass = { workspace = true, features = ["save_kdbx4"] }
# The scripted server the fetch tests download from; no shipped build turns `fake` on.
kx-platform-net = { path = "../../crates/kx-platform-net", features = ["fake"] }
