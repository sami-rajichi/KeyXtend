# Supply-chain policy. Generated from `cargo deny init` (cargo-deny 0.20.2), trimmed to our settings.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Platforms we ship or plan to ship on.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[licenses]
# Licences that allow a closed, sold app (ADR-0030, decision 6).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
]
# LGPL is deliberately not here: ADR-0030 allows it only as a reviewed, replaceable library.
# Don't warn about allow-listed licences no dependency currently uses.
unused-allowed-license = "allow"

# build-only (xtask words), owner 2026-10-24
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[licenses.private]
# Our own crates are unpublished and all rights reserved under LICENSE (ADR-0030).
ignore = true

[advisories]
# Yanked crates fail the check.
yanked = "deny"
# Unmaintained-crate advisories are checked for every crate in the workspace.
unmaintained = "workspace"
ignore = []

[bans]
# Multiple versions of the same crate only warn.
multiple-versions = "warn"
# A `*` version requirement fails the check.
wildcards = "deny"
# ...except our own workspace path dependencies, which are always fine.
allow-wildcard-paths = true
# Older copies some dependencies still use beside the newer ones: cxx-qt 0.10.0's (ADR-0013) and a few proc-macros'.
# Review them at each upgrade of the crates the reasons name, which may drop them.
skip = [
    { crate = "codespan-reporting@0.11.1", reason = "cxx-qt-build uses it; cxx-gen uses 0.13" },
    { crate = "unicode-width@0.1.14", reason = "codespan-reporting 0.11 uses it" },
    { crate = "syn@2.0.119", reason = "windows-implement, windows-interface and zerocopy-derive used it before cxx-qt; cxx-qt-gen and cxx-qt-macro use it too; serde and cxx-gen use 3" },
    { crate = "thiserror@1.0.69", reason = "cxx-qt uses it at run time, so it ships in the binary; qt-build-utils and clang-format use it at build time; our crates use 2" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1 uses it" },
]

[sources]
# Any registry or git source other than crates.io fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
