# Supply-chain policy. Generated from `cargo deny init` (cargo-deny 0.20.2), trimmed to our settings.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Platforms we ship or plan to ship on.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[licenses]
# Exact allow-list from docs/adr/0006-licence-gpl3.md.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
    "GPL-3.0-or-later",
]
# LGPL is deliberately not here: ADR-0006 requires a reviewed per-crate exception instead.
# Don't warn about allow-listed licences no dependency currently uses.
unused-allowed-license = "allow"

[advisories]
# Yanked crates fail the check.
yanked = "deny"
# Unmaintained-crate advisories are checked for every crate in the workspace.
unmaintained = "workspace"
ignore = []

[bans]
# Multiple versions of the same crate only warn.
multiple-versions = "warn"
# A `*` version requirement fails the check.
wildcards = "deny"
# ...except our own workspace path dependencies, which are always fine.
allow-wildcard-paths = true

[sources]
# Any registry or git source other than crates.io fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
